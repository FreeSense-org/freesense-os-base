name: Publish FreeSense Stable train

# A Stable release is an exact sealed lock (config/releases/<version>.json).
# System and Optional Packages are built by the same delta component farm as
# Development, from the lock's commits and the FreeBSD pin it was sealed
# against; the sealed pair is then signed into the channel manifests, and
# release.yml builds, boot-tests and publishes the images.

on:
  workflow_dispatch:
    inputs:
      release:
        description: Exact checked release lock to publish
        type: string
        required: true
      queue_development:
        description: Start a fresh Development build after Stable is fully published
        type: boolean
        default: false
        required: true
      build_host:
        description: Where System is built (the lock's pin and executor must match)
        type: choice
        options: [dedicated, github-amd64]
        default: dedicated

permissions: {actions: write, contents: read, id-token: write}
concurrency: {group: release-control, cancel-in-progress: false}

jobs:
  plan:
    runs-on: ubuntu-24.04
    environment: build-coordinator
    outputs:
      platform: ${{ steps.plan.outputs.platform }}
      system: ${{ steps.plan.outputs.system }}
      packages: ${{ steps.plan.outputs.packages }}
      system_plan: ${{ steps.plan.outputs.system_plan }}
      packages_plan: ${{ steps.plan.outputs.packages_plan }}
      build_host: ${{ steps.plan.outputs.build_host }}
      system_generation: ${{ steps.system-generation.outputs.generation }}
      packages_generation: ${{ steps.packages-generation.outputs.generation }}
      freebsd_pin_id: ${{ steps.plan.outputs.freebsd_pin_id }}
      package_train: ${{ steps.plan.outputs.package_train }}
      release_version: ${{ steps.plan.outputs.release_version }}
      abi: ${{ steps.plan.outputs.abi }}
      altabi: ${{ steps.plan.outputs.altabi }}
      osversion: ${{ steps.plan.outputs.osversion }}
      public_base_url: ${{ steps.plan.outputs.public_base_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: false}
      - id: plan
        run: >-
          python3 scripts/stable_farm_plan.py --os-base-sha "${GITHUB_SHA}"
          --release "${{ inputs.release }}" --build-host "${{ inputs.build_host }}"
          --github-output "${GITHUB_OUTPUT}"
      - run: go build -trimpath -o "${RUNNER_TEMP}/fsbuild" ./cmd/fsbuild
      - name: Acquire generation coordinator
        env:
          R2_CREDENTIAL_BROKER_URL: ${{ vars.R2_CREDENTIAL_BROKER_URL }}
          R2_CREDENTIAL_BROKER_AUDIENCE: ${{ vars.R2_CREDENTIAL_BROKER_AUDIENCE }}
          R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: >-
          "${RUNNER_TEMP}/fsbuild" credentials acquire --broker-url "${R2_CREDENTIAL_BROKER_URL}"
          --audience "${R2_CREDENTIAL_BROKER_AUDIENCE}" --role coordinator
          --expected-bucket "${R2_BUCKET}" --expected-prefix v1 --expected-endpoint "${R2_ENDPOINT}"
          --github-env "${GITHUB_ENV}"
      # The farm reserves the same fingerprints with the same proposal, so it
      # reads back exactly these generations.
      - id: system-generation
        env: {R2_BUCKET: "${{ vars.R2_BUILD_BUCKET }}", FSBUILD_STORE_PREFIX: v1}
        run: |
          "${RUNNER_TEMP}/fsbuild" state reserve-generation --fingerprint "${{ steps.plan.outputs.system }}" \
            --proposed "${GITHUB_RUN_NUMBER}" --output "${RUNNER_TEMP}/generation.json"
          echo "generation=$(jq -r .generation "${RUNNER_TEMP}/generation.json")" >>"${GITHUB_OUTPUT}"
      - id: packages-generation
        env: {R2_BUCKET: "${{ vars.R2_BUILD_BUCKET }}", FSBUILD_STORE_PREFIX: v1}
        run: |
          "${RUNNER_TEMP}/fsbuild" state reserve-generation --fingerprint "${{ steps.plan.outputs.packages }}" \
            --proposed "${GITHUB_RUN_NUMBER}" --output "${RUNNER_TEMP}/generation.json"
          echo "generation=$(jq -r .generation "${RUNNER_TEMP}/generation.json")" >>"${GITHUB_OUTPUT}"

  system:
    needs: plan
    uses: ./.github/workflows/component-farm.yml
    with:
      stage: system
      plan: ${{ needs.plan.outputs.system_plan }}
      pair_generation: ${{ github.run_number }}
    secrets: inherit

  packages:
    needs: [plan, system]
    uses: ./.github/workflows/component-farm.yml
    with:
      stage: packages
      plan: ${{ needs.plan.outputs.packages_plan }}
      pair_generation: ${{ github.run_number }}
    secrets: inherit

  seal:
    needs: [plan, system, packages]
    runs-on: ubuntu-24.04
    environment: channel-publisher
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: false}
      - run: go build -trimpath -o "${RUNNER_TEMP}/fsbuild" ./cmd/fsbuild
      - name: Acquire channel writer
        env:
          R2_CREDENTIAL_BROKER_URL: ${{ vars.R2_CREDENTIAL_BROKER_URL }}
          R2_CREDENTIAL_BROKER_AUDIENCE: ${{ vars.R2_CREDENTIAL_BROKER_AUDIENCE }}
          R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: >-
          "${RUNNER_TEMP}/fsbuild" credentials acquire --broker-url "${R2_CREDENTIAL_BROKER_URL}"
          --audience "${R2_CREDENTIAL_BROKER_AUDIENCE}" --role channel-writer
          --expected-bucket "${R2_BUCKET}" --expected-prefix v1 --expected-endpoint "${R2_ENDPOINT}"
          --github-env "${GITHUB_ENV}"
      - name: Publish immutable stable patch
        env:
          R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
          FSBUILD_STORE_PREFIX: v1
          SIGNING_KEY: ${{ secrets.FREESENSE_PKG_SIGNING_KEY }}
        run: |
          key=$(mktemp); trap 'rm -f "$key"' EXIT; chmod 600 "$key"; printf '%s' "${SIGNING_KEY}" >"$key"
          published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          packages_marker="${RUNNER_TEMP}/packages-complete.json"
          curl --fail --silent --show-error --location \
            "${{ needs.plan.outputs.public_base_url }}/artifacts/packages/${{ needs.plan.outputs.package_train }}/${{ needs.plan.outputs.packages }}/complete.json" \
            --output "${packages_marker}"
          packages_built_against=$(jq -er \
            '(.inputs.built_against_system // .inputs.system) as $system |
             select(.schema_version == "freesense.artifact/v1" and .stage == "packages" and
             .fingerprint == "${{ needs.plan.outputs.packages }}" and
             ($system | test("^[0-9a-f]{64}$"))) | $system' \
            "${packages_marker}")
          # amd64 devices read the legacy repos.manifest.json (Stable 1.0.x) or
          # repos.amd64.manifest.json (1.1 and later): seal both identically.
          for mode in legacy qualified; do
          extra=()
          if [ "${mode}" = qualified ]; then extra=(--qualified-manifest --architecture amd64 --package-arch amd64); fi
          "${RUNNER_TEMP}/fsbuild" channel seal-stable "${extra[@]}" \
            --version "${{ needs.plan.outputs.release_version }}" \
            --system-fingerprint "${{ needs.plan.outputs.system }}" \
            --system-url "${{ needs.plan.outputs.public_base_url }}/artifacts/system/${{ needs.plan.outputs.system }}/amd64" \
            --system-generation "${{ needs.plan.outputs.system_generation }}" \
            --packages-fingerprint "${{ needs.plan.outputs.packages }}" \
            --packages-url "${{ needs.plan.outputs.public_base_url }}/artifacts/packages/${{ needs.plan.outputs.package_train }}/${{ needs.plan.outputs.packages }}/amd64" \
            --packages-generation "${{ needs.plan.outputs.packages_generation }}" \
            --packages-built-against-system "${packages_built_against}" \
            --freebsd-pin-id "${{ needs.plan.outputs.freebsd_pin_id }}" \
            --package-train "${{ needs.plan.outputs.package_train }}" \
            --abi "${{ needs.plan.outputs.abi }}" --altabi "${{ needs.plan.outputs.altabi }}" \
            --osversion "${{ needs.plan.outputs.osversion }}" \
            --published-at "${published_at}" --private-key "$key"
          done

  # Images are built from the signed Stable channel just sealed: release.yml
  # reads it back, plans the installer and cloud images, boot-tests them, and
  # publishes the downloads and the release documents (stable.amd64.json and
  # the legacy stable.json).
  release:
    needs: [plan, seal]
    uses: ./.github/workflows/release.yml
    with:
      operation: bundle
      channel: stable
      target: amd64
      system_fingerprint: ${{ needs.plan.outputs.system }}
      packages_fingerprint: ${{ needs.plan.outputs.packages }}
      pair_generation: ${{ github.run_number }}
      build_host: ${{ needs.plan.outputs.build_host }}
      image_host: ${{ vars.DEVELOPMENT_RELEASE_HOST || 'github-amd64' }}
    secrets: inherit

  queue-development:
    needs: release
    if: inputs.queue_development
    runs-on: ubuntu-24.04
    permissions: {actions: write, contents: read}
    steps:
      - name: Dispatch Development only after Stable is complete
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run development-multiarch.yml --repo "${GITHUB_REPOSITORY}" --ref main
