name: System

# System is a component of the multiarch cycle, not a build of its own. The
# standalone planner and its 19-shard farm were retired with the legacy layout:
# both architectures are now reserved, built and published as one frozen pair by
# development-multiarch.yml, which owns the daily schedule.

on:
  workflow_call:
    inputs:
      multiarch_plan: {type: string, required: true}
      pair_generation: {type: string, required: true}
      suppress_publication: {type: boolean, required: true}
      target:
        type: string
        required: true
    outputs:
      system_fingerprint:
        description: Exact immutable System result
        value: ${{ jobs.multiarch.outputs.fingerprint }}

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: system-planner-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  reject_invalid_pair:
    if: ${{ !inputs.suppress_publication }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Multiarch component calls must suppress mutable publication.' >&2
          exit 1

  multiarch:
    if: ${{ inputs.suppress_publication }}
    uses: ./.github/workflows/component-farm.yml
    with:
      stage: system
      plan: ${{ inputs.multiarch_plan }}
      pair_generation: ${{ inputs.pair_generation }}
    secrets: inherit
