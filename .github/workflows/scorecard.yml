name: OpenSSF Scorecard

# Supply-chain security checks (pinned actions, token permissions, branch
# protection, signed releases, ...). Results appear under Security > Code
# scanning. This workflow builds nothing and never triggers a build.
on:
  branch_protection_rule:
  schedule:
    # Mondays 05:17 UTC, away from the 01:00 Development cycle.
    - cron: '17 5 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Results stay in this repository's code scanning; nothing is sent
          # to the public OpenSSF API.
          publish_results: false
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          category: scorecard
