name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: broker/package-lock.json
      - run: go test ./...
      - run: test -z "$(gofmt -l .)"
      - run: npm --prefix broker ci
      - run: npm --prefix broker test
      - run: npm --prefix broker run deploy:dry
      - run: python3 scripts/validate-build-pipeline.py
      - run: python3 -m py_compile scripts/*.py
      - name: Parse scripts and checked data
        run: |
          bash -n scripts/runner/run-vm.sh
          sh -n scripts/runner/worker-common.sh scripts/runner/probe.sh scripts/runner/stages/*.sh apply.sh
          jq -e . config/*.json broker/*.json >/dev/null
          git diff --check
