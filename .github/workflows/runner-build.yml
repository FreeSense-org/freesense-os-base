name: Reusable build runner

on:
  workflow_call:
    inputs:
      stage: {type: string, required: true}
      fingerprint: {type: string, required: true}
      platform_id: {type: string, required: true}
      system_id: {type: string, required: true}
      source_sha: {type: string, required: true}
      system_sha: {type: string, required: true}
      packages_sha: {type: string, required: true}
      packages_id: {type: string, required: false, default: ""}
      os_base_sha: {type: string, required: true}
      freebsd_sha: {type: string, required: true}
      ports_sha: {type: string, required: true}
      image_sha256: {type: string, required: true}
      worker_tools_sha256: {type: string, required: true}
      jail_object: {type: string, required: true}
      freebsd_pin_id: {type: string, required: true}
      product_version: {type: string, required: true}
      package_train: {type: string, required: true}
      generation: {type: string, required: true}
      system_generation: {type: string, required: false, default: "0"}
      public_base_url: {type: string, required: true}
      channel: {type: string, required: false, default: devel}
      channel_payload_sha256: {type: string, required: false, default: ""}
      channel_payload_base64: {type: string, required: false, default: ""}
      channel_signature_base64: {type: string, required: false, default: ""}
      bundle_id: {type: string, required: false, default: ""}
      cloud_filesystem: {type: string, required: false, default: ""}
      cloud_virtual_size_gib: {type: string, required: false, default: "0"}
      target: {type: string, required: false, default: amd64}
      architecture: {type: string, required: false, default: amd64}
      package_arch: {type: string, required: false, default: amd64}
      abi: {type: string, required: false, default: 'FreeBSD:16:amd64'}
      altabi: {type: string, required: false, default: 'freebsd:16:x86:64'}
      freebsd_target: {type: string, required: false, default: amd64}
      freebsd_target_arch: {type: string, required: false, default: amd64}
      poudriere_arch: {type: string, required: false, default: amd64.amd64}
      kernel: {type: string, required: false, default: FreeSense}
      executor: {type: string, required: false, default: native-amd64}
      image_profile: {type: string, required: false, default: generic-amd64}
      system_image_profile: {type: string, required: false, default: ''}
      firmware: {type: string, required: false, default: 'bios,uefi'}
      image_capabilities: {type: string, required: false, default: '{"bios":true,"cloud_init":true,"installer_img":false,"iso":true,"uefi":true}'}
      installer_format: {type: string, required: false, default: iso}
      publish_enabled: {type: string, required: false, default: 'true'}
      boot_inputs: {type: string, required: false, default: '{}'}
      target_models: {type: string, required: false, default: '[]'}
      partition_scheme: {type: string, required: false, default: gpt}
      appliance_filesystem: {type: string, required: false, default: ''}
      appliance_format: {type: string, required: false, default: ''}
      appliance_compression: {type: string, required: false, default: ''}
      build_host: {type: string, required: false, default: dedicated}

jobs:
  build:
    runs-on: ${{ inputs.build_host == 'github-hosted' && 'ubuntu-24.04' || 'build-runner' }}
    concurrency:
      group: ${{ inputs.build_host == 'github-hosted' && 'freesense-github-hosted-build' || 'freesense-kvm-host' }}
      cancel-in-progress: false
    timeout-minutes: 360
    environment: build
    permissions:
      actions: write
      contents: read
      id-token: write

    env:
      R2_CREDENTIAL_BROKER_URL: ${{ vars.R2_CREDENTIAL_BROKER_URL }}
      R2_CREDENTIAL_BROKER_AUDIENCE: ${{ vars.R2_CREDENTIAL_BROKER_AUDIENCE }}
      R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      FSBUILD_STORE_PREFIX: v1
      STAGE: ${{ inputs.stage }}
      FINGERPRINT: ${{ inputs.fingerprint }}
      PLATFORM_ID: ${{ inputs.platform_id }}
      SYSTEM_ID: ${{ inputs.system_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SYSTEM_SHA: ${{ inputs.system_sha }}
      PACKAGES_SHA: ${{ inputs.packages_sha }}
      PACKAGES_ID: ${{ inputs.packages_id }}
      OS_BASE_SHA: ${{ inputs.os_base_sha }}
      FREEBSD_SHA: ${{ inputs.freebsd_sha }}
      PORTS_SHA: ${{ inputs.ports_sha }}
      IMAGE_SHA256: ${{ inputs.image_sha256 }}
      WORKER_TOOLS_SHA256: ${{ inputs.worker_tools_sha256 }}
      JAIL_OBJECT: ${{ inputs.jail_object }}
      FREEBSD_PIN_ID: ${{ inputs.freebsd_pin_id }}
      PRODUCT_VERSION: ${{ inputs.product_version }}
      PACKAGE_TRAIN: ${{ inputs.package_train }}
      GENERATION: ${{ inputs.generation }}
      SYSTEM_GENERATION: ${{ inputs.system_generation }}
      PUBLIC_BASE_URL: ${{ inputs.public_base_url }}
      CHANNEL: ${{ inputs.channel }}
      CHANNEL_PAYLOAD_SHA256: ${{ inputs.channel_payload_sha256 }}
      CHANNEL_PAYLOAD_B64: ${{ inputs.channel_payload_base64 }}
      CHANNEL_SIGNATURE_B64: ${{ inputs.channel_signature_base64 }}
      BUNDLE_ID: ${{ inputs.bundle_id }}
      CLOUD_FILESYSTEM: ${{ inputs.cloud_filesystem }}
      CLOUD_VIRTUAL_SIZE_GIB: ${{ inputs.cloud_virtual_size_gib }}
      TARGET: ${{ inputs.target }}
      ARCHITECTURE: ${{ inputs.architecture }}
      PACKAGE_ARCH: ${{ inputs.package_arch }}
      ABI: ${{ inputs.abi }}
      ALTABI: ${{ inputs.altabi }}
      FREEBSD_TARGET: ${{ inputs.freebsd_target }}
      FREEBSD_TARGET_ARCH: ${{ inputs.freebsd_target_arch }}
      POUDRIERE_ARCH: ${{ inputs.poudriere_arch }}
      KERNEL: ${{ inputs.kernel }}
      EXECUTOR: ${{ inputs.executor }}
      IMAGE_PROFILE: ${{ inputs.image_profile }}
      SYSTEM_IMAGE_PROFILE: ${{ inputs.system_image_profile != '' && inputs.system_image_profile || (inputs.architecture == 'arm64' && 'generic-arm64-uefi' || 'generic-amd64') }}
      FIRMWARE: ${{ inputs.firmware }}
      IMAGE_CAPABILITIES: ${{ inputs.image_capabilities }}
      INSTALLER_FORMAT: ${{ inputs.installer_format }}
      PUBLISH_ENABLED: ${{ inputs.publish_enabled }}
      BOOT_INPUTS: ${{ inputs.boot_inputs }}
      TARGET_MODELS: ${{ inputs.target_models }}
      PARTITION_SCHEME: ${{ inputs.partition_scheme }}
      APPLIANCE_FILESYSTEM: ${{ inputs.appliance_filesystem }}
      APPLIANCE_FORMAT: ${{ inputs.appliance_format }}
      APPLIANCE_COMPRESSION: ${{ inputs.appliance_compression }}
      BUILD_VCPUS: ${{ inputs.build_host == 'github-hosted' && '4' || '12' }}
      BUILD_MEMORY_MIB: ${{ inputs.build_host == 'github-hosted' && '10240' || '32768' }}
      BUILD_DISK_GIB: ${{ inputs.build_host == 'github-hosted' && '110' || '160' }}
      BUILD_MINIMUM_FREE_GIB: ${{ inputs.build_host == 'github-hosted' && '70' || '80' }}
      BUILD_TIMEOUT_SECONDS: ${{ inputs.build_host == 'github-hosted' && '19800' || '18000' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare disposable GitHub build host
        if: inputs.build_host == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf cloud-image-utils
          sudo chmod a+rw /dev/kvm
          nproc
          free -h
          df -h
      - run: go build -trimpath -o "${RUNNER_TEMP}/fsbuild" ./cmd/fsbuild
      - name: Verify repository signing trust root
        env: {SIGNING_KEY: "${{ secrets.FREESENSE_PKG_SIGNING_KEY }}"}
        run: |
          umask 077
          printf '%s' "${SIGNING_KEY}" >"${RUNNER_TEMP}/repo.key"
          openssl pkey -in "${RUNNER_TEMP}/repo.key" -pubout -out "${RUNNER_TEMP}/repo.pub"
          cmp "${RUNNER_TEMP}/repo.pub" config/channel-signing-public.pem
      - name: Acquire artifact credential
        run: >-
          "${RUNNER_TEMP}/fsbuild" credentials acquire
          --broker-url "${R2_CREDENTIAL_BROKER_URL}"
          --audience "${R2_CREDENTIAL_BROKER_AUDIENCE}"
          --role artifact-writer
          --expected-bucket "${R2_BUCKET}"
          --expected-prefix v1
          --expected-endpoint "${R2_ENDPOINT}"
          --github-env "${GITHUB_ENV}"
      - id: reuse
        name: Reuse completed immutable result
        run: |
          args=(--stage "${STAGE}" --id "${FINGERPRINT}" --platform-id "${PLATFORM_ID}" \
            --generation "${GENERATION}" --architecture "${ARCHITECTURE}" \
            --package-arch "${PACKAGE_ARCH}" --image-profile "${IMAGE_PROFILE}" \
            --github-output "${GITHUB_OUTPUT}")
          if [[ "${STAGE}" == packages || "${STAGE}" == iso || "${STAGE}" == cloud || "${STAGE}" == appliance ]]; then args+=(--system-id "${SYSTEM_ID}"); fi
          if [[ "${STAGE}" == iso || "${STAGE}" == cloud || "${STAGE}" == appliance ]]; then args+=(--packages-id "${PACKAGES_ID}"); fi
          if [[ "${STAGE}" == cloud ]]; then
            args+=(--filesystem "${CLOUD_FILESYSTEM}" --virtual-size-gib "${CLOUD_VIRTUAL_SIZE_GIB}")
          fi
          if [[ "${STAGE}" == packages ]]; then args+=(--package-train "${PACKAGE_TRAIN}"); fi
          if [[ "${STAGE}" == packages ]]; then args+=(--freebsd-pin-id "${FREEBSD_PIN_ID}"); fi
          "${RUNNER_TEMP}/fsbuild" result check "${args[@]}"
      - name: Verify required System result
        if: steps.reuse.outputs.complete != 'true' && inputs.stage != 'system'
        run: |
          output=$(mktemp)
          trap 'rm -f "${output}"' EXIT
          "${RUNNER_TEMP}/fsbuild" result check --stage system \
            --id "${SYSTEM_ID}" --platform-id "${PLATFORM_ID}" \
            --architecture "${ARCHITECTURE}" --package-arch "${PACKAGE_ARCH}" \
            --image-profile "${SYSTEM_IMAGE_PROFILE}" \
            --github-output "${output}"
          grep -qx 'complete=true' "${output}"
      - name: Render checked FreeBSD worker
        if: steps.reuse.outputs.complete != 'true' && steps.reuse.outputs.assembled != 'true'
        env:
          FREESENSE_REPO_SIGNING_KEY: ${{ secrets.FREESENSE_PKG_SIGNING_KEY }}
        run: |
          python3 scripts/render-worker.py --common scripts/runner/worker-common.sh \
            --stages scripts/runner/stages --output "${RUNNER_TEMP}/worker.sh"
          sh -n "${RUNNER_TEMP}/worker.sh"
      - name: Build in a fresh 12-vCPU, 32-GiB FreeBSD VM
        if: steps.reuse.outputs.complete != 'true' && steps.reuse.outputs.assembled != 'true'
        env:
          FSBUILD: ${{ runner.temp }}/fsbuild
        run: >-
          scripts/runner/run-vm.sh --image-sha256 "${IMAGE_SHA256}"
          --script "${RUNNER_TEMP}/worker.sh" --timeout "${BUILD_TIMEOUT_SECONDS}"
          --vcpus "${BUILD_VCPUS}" --memory-mib "${BUILD_MEMORY_MIB}"
          --disk-gib "${BUILD_DISK_GIB}" --minimum-free-gib "${BUILD_MINIMUM_FREE_GIB}"
          --failure-dir "${RUNNER_TEMP}/build-vm-failure"
      - name: Upload build VM failure diagnostics
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: build-vm-failure-${{ inputs.stage }}-${{ inputs.fingerprint }}
          path: ${{ runner.temp }}/build-vm-failure/
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 6
      - name: Boot-check completed ISO
        if: inputs.stage == 'iso'
        run: >-
          bash scripts/runner/smoke-iso.sh
          --public-base-url "${PUBLIC_BASE_URL}"
          --fingerprint "${FINGERPRINT}"
          --system "${SYSTEM_ID}"
          --packages "${PACKAGES_ID}"
          --generation "${GENERATION}"
          --channel "${CHANNEL}"
          --package-train "${PACKAGE_TRAIN}"
          --channel-payload "${CHANNEL_PAYLOAD_SHA256}"
          --architecture "${ARCHITECTURE}"
      - name: Commit boot-verified ISO result
        if: inputs.stage == 'iso'
        run: >-
          "${RUNNER_TEMP}/fsbuild" result promote --stage iso --id "${FINGERPRINT}"
      - name: Boot-check completed cloud images
        id: cloud_smoke
        if: inputs.stage == 'cloud'
        env:
          CLOUD_SMOKE_FAILURE_DIR: ${{ runner.temp }}/cloud-smoke-failure
        run: |
          mkdir -p "${CLOUD_SMOKE_FAILURE_DIR}"
          bash scripts/runner/smoke-cloud.sh \
            --public-base-url "${PUBLIC_BASE_URL}" \
            --fingerprint "${FINGERPRINT}" \
            --bundle "${BUNDLE_ID}" \
            --system "${SYSTEM_ID}" \
            --packages "${PACKAGES_ID}" \
            --generation "${GENERATION}" \
            --channel "${CHANNEL}" \
            --architecture "${ARCHITECTURE}" \
            --filesystem "${CLOUD_FILESYSTEM}" \
            --virtual-size-gib "${CLOUD_VIRTUAL_SIZE_GIB}" \
            --failure-dir "${CLOUD_SMOKE_FAILURE_DIR}"
      - name: Commit boot-verified cloud result
        if: inputs.stage == 'cloud'
        run: >-
          "${RUNNER_TEMP}/fsbuild" result promote --stage cloud --id "${FINGERPRINT}"
      - name: Commit structurally verified appliance result
        if: inputs.stage == 'appliance'
        run: >-
          "${RUNNER_TEMP}/fsbuild" result promote --stage appliance --id "${FINGERPRINT}"
      - name: Upload cloud smoke failure artifacts
        if: failure() && inputs.stage == 'cloud'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cloud-smoke-failure-${{ inputs.cloud_filesystem }}-${{ inputs.fingerprint }}
          path: ${{ runner.temp }}/cloud-smoke-failure/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
      - name: Clean sensitive runner files
        if: always()
        run: >-
          rm -f "${RUNNER_TEMP}/repo.key" "${RUNNER_TEMP}/repo.pub"
          "${RUNNER_TEMP}/worker.sh"
