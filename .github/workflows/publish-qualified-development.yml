name: Publish qualified Development architecture

on:
  workflow_call:
    inputs:
      architecture: {type: string, required: true}

permissions: {actions: read, contents: read, id-token: write}

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: channel-publisher
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: {go-version-file: go.mod, cache: false}
      - name: Download exact architecture documents
        env: {GH_TOKEN: '${{ github.token }}', ARCH: '${{ inputs.architecture }}'}
        run: |
          set -euo pipefail
          case "${ARCH}" in amd64) package_arch=amd64 ;; arm64) package_arch=aarch64 ;; *) exit 1 ;; esac
          mkdir -p "${RUNNER_TEMP}/bundle/repository" "${RUNNER_TEMP}/bundle/release"
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "multiarch-repository-${ARCH}" --dir "${RUNNER_TEMP}/bundle/repository"
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "multiarch-release-${ARCH}" --dir "${RUNNER_TEMP}/bundle/release"
          test -s "${RUNNER_TEMP}/bundle/repository/repos.${package_arch}.manifest.json"
          test -s "${RUNNER_TEMP}/bundle/release/devel.json"
          go build -trimpath -o "${RUNNER_TEMP}/fsbuild" ./cmd/fsbuild
      # credentials acquire writes to GITHUB_ENV, which GitHub applies only to
      # later steps, so every credential is acquired in a step of its own.
      - name: Acquire downloads writer
        env:
          R2_CREDENTIAL_BROKER_URL: ${{ vars.R2_CREDENTIAL_BROKER_URL }}
          R2_CREDENTIAL_BROKER_AUDIENCE: ${{ vars.R2_CREDENTIAL_BROKER_AUDIENCE }}
          R2_BUCKET: ${{ vars.R2_DOWNLOAD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          "${RUNNER_TEMP}/fsbuild" credentials acquire --broker-url "${R2_CREDENTIAL_BROKER_URL}" \
            --audience "${R2_CREDENTIAL_BROKER_AUDIENCE}" --role download-writer \
            --expected-bucket "${R2_BUCKET}" --expected-prefix v1 --expected-endpoint "${R2_ENDPOINT}" \
            --github-env "${GITHUB_ENV}"
      - name: Publish immutable downloads
        env:
          R2_BUCKET: ${{ vars.R2_DOWNLOAD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: bash scripts/publish_iso.sh "${RUNNER_TEMP}/bundle/release/devel.json"
      - name: Acquire channel writer
        env:
          R2_CREDENTIAL_BROKER_URL: ${{ vars.R2_CREDENTIAL_BROKER_URL }}
          R2_CREDENTIAL_BROKER_AUDIENCE: ${{ vars.R2_CREDENTIAL_BROKER_AUDIENCE }}
          R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          "${RUNNER_TEMP}/fsbuild" credentials acquire --broker-url "${R2_CREDENTIAL_BROKER_URL}" \
            --audience "${R2_CREDENTIAL_BROKER_AUDIENCE}" --role channel-writer \
            --expected-bucket "${R2_BUCKET}" --expected-prefix v1 --expected-endpoint "${R2_ENDPOINT}" \
            --github-env "${GITHUB_ENV}"
      - name: Commit qualified architecture
        env:
          ARCH: ${{ inputs.architecture }}
          R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          FSBUILD_STORE_PREFIX: v1
        run: |
          case "${ARCH}" in amd64) package_arch=amd64 ;; arm64) package_arch=aarch64 ;; *) exit 1 ;; esac
          "${RUNNER_TEMP}/fsbuild" multiarch commit-qualified --architecture "${ARCH}" \
            --repositories "${RUNNER_TEMP}/bundle/repository/repos.${package_arch}.manifest.json" \
            --release "${RUNNER_TEMP}/bundle/release/devel.json" \
            --public-key config/channel-signing-public.pem

  # The broker issues the coordinator role only to the build-coordinator
  # environment, and the channel roles only to channel-publisher, so the cycle
  # is marked published by its own job once the architecture is published.
  cycle:
    needs: publish
    runs-on: ubuntu-24.04
    environment: build-coordinator
    # amd64 and arm64 each mark the same cycle document; one at a time.
    concurrency: {group: development-cycle-commit, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: {go-version-file: go.mod, cache: false}
      - run: go build -trimpath -o "${RUNNER_TEMP}/fsbuild" ./cmd/fsbuild
      - name: Acquire cycle coordinator
        env:
          R2_CREDENTIAL_BROKER_URL: ${{ vars.R2_CREDENTIAL_BROKER_URL }}
          R2_CREDENTIAL_BROKER_AUDIENCE: ${{ vars.R2_CREDENTIAL_BROKER_AUDIENCE }}
          R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          "${RUNNER_TEMP}/fsbuild" credentials acquire --broker-url "${R2_CREDENTIAL_BROKER_URL}" \
            --audience "${R2_CREDENTIAL_BROKER_AUDIENCE}" --role coordinator \
            --expected-bucket "${R2_BUCKET}" --expected-prefix v1 --expected-endpoint "${R2_ENDPOINT}" \
            --github-env "${GITHUB_ENV}"
      - name: Commit architecture completion to the frozen cycle
        env:
          ARCH: ${{ inputs.architecture }}
          R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          FSBUILD_STORE_PREFIX: v1
        run: |
          "${RUNNER_TEMP}/fsbuild" multiarch cycle-get --output "${RUNNER_TEMP}/cycle-state.json"
          jq -e --arg arch "${ARCH}" '
            .cycle.architectures[$arch] = {system:"complete",packages:"complete",artifacts:"complete",published:true} |
            .cycle
          ' "${RUNNER_TEMP}/cycle-state.json" >"${RUNNER_TEMP}/cycle-complete.json"
          "${RUNNER_TEMP}/fsbuild" multiarch cycle-commit --document "${RUNNER_TEMP}/cycle-complete.json"
