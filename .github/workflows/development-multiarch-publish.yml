name: Publish Development multiarch

on:
  workflow_run:
    workflows: [Development multiarch]
    types: [completed]

permissions: {actions: read, contents: read, id-token: write}
concurrency: {group: development-multiarch-publication, cancel-in-progress: false}

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.MULTIARCH_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: channel-publisher
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: {go-version-file: go.mod, cache: false}
      - name: Download the exact successful canary evidence
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bundle"
          gh run download "${UPSTREAM_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name multiarch-authoritative-completion --dir "${RUNNER_TEMP}/bundle/completion"
          gh run download "${UPSTREAM_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name multiarch-repository-amd64 --dir "${RUNNER_TEMP}/bundle/repositories"
          gh run download "${UPSTREAM_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name multiarch-repository-arm64 --dir "${RUNNER_TEMP}/bundle/repositories"
          gh run download "${UPSTREAM_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name multiarch-release-amd64 --dir "${RUNNER_TEMP}/bundle/amd64"
          gh run download "${UPSTREAM_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name multiarch-release-arm64 --dir "${RUNNER_TEMP}/bundle/arm64"
      - name: Verify the signed commit and every local document before writes
        run: |
          set -euo pipefail
          go build -trimpath -o "${RUNNER_TEMP}/fsbuild" ./cmd/fsbuild
          "${RUNNER_TEMP}/fsbuild" multiarch verify \
            --document "${RUNNER_TEMP}/bundle/completion/multiarch-release.json" \
            --public-key config/channel-signing-public.pem \
            --output "${RUNNER_TEMP}/bundle/completion/payload.json"
          python3 scripts/verify_multiarch_publication.py \
            --completion "${RUNNER_TEMP}/bundle/completion/payload.json" \
            --amd64-repositories "${RUNNER_TEMP}/bundle/repositories/repos.amd64.manifest.json" \
            --arm64-repositories "${RUNNER_TEMP}/bundle/repositories/repos.aarch64.manifest.json" \
            --amd64-release "${RUNNER_TEMP}/bundle/amd64/devel.json" \
            --arm64-release "${RUNNER_TEMP}/bundle/arm64/devel.json"
      # Generations are reserved per System/Packages pair, so a cycle that
      # changed nothing (a nightly after a manual run, say) re-signs the pair
      # already committed. Its fresh timestamps can never match the live bytes,
      # which the first publication keeps, so it is not published again.
      - id: live
        name: Skip a pair that is already the authoritative commit point
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --location --output "${RUNNER_TEMP}/live-multiarch.json" \
            --write-out '%{http_code}' "https://pkg.freesense.org/v1/releases/devel.multiarch.json?multiarch=verify")
          committed=false
          if [[ "${status}" == 200 ]]; then
            "${RUNNER_TEMP}/fsbuild" multiarch verify \
              --document "${RUNNER_TEMP}/live-multiarch.json" \
              --public-key config/channel-signing-public.pem \
              --output "${RUNNER_TEMP}/live-payload.json"
            if jq -e --slurpfile next "${RUNNER_TEMP}/bundle/completion/payload.json" \
                '.generation == $next[0].generation and .pair_fingerprint == $next[0].pair_fingerprint' \
                "${RUNNER_TEMP}/live-payload.json" >/dev/null; then
              committed=true
              echo "::notice::Generation $(jq -r .generation "${RUNNER_TEMP}/live-payload.json") of this pair is already the authoritative commit point; nothing to publish."
            fi
          elif [[ "${status}" != 404 ]]; then
            echo "::error::Unexpected HTTP ${status} reading the live multiarch commit point" >&2
            exit 1
          fi
          echo "committed=${committed}" >>"${GITHUB_OUTPUT}"
      - name: Acquire downloads writer
        if: steps.live.outputs.committed != 'true'
        env:
          R2_CREDENTIAL_BROKER_URL: ${{ vars.R2_CREDENTIAL_BROKER_URL }}
          R2_CREDENTIAL_BROKER_AUDIENCE: ${{ vars.R2_CREDENTIAL_BROKER_AUDIENCE }}
          R2_BUCKET: ${{ vars.R2_DOWNLOAD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: >-
          "${RUNNER_TEMP}/fsbuild" credentials acquire --broker-url "${R2_CREDENTIAL_BROKER_URL}"
          --audience "${R2_CREDENTIAL_BROKER_AUDIENCE}" --role download-writer
          --expected-bucket "${R2_BUCKET}" --expected-prefix v1 --expected-endpoint "${R2_ENDPOINT}"
          --github-env "${GITHUB_ENV}"
      - name: Publish all immutable download artifacts
        if: steps.live.outputs.committed != 'true'
        env:
          R2_BUCKET: ${{ vars.R2_DOWNLOAD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          bash scripts/publish_iso.sh "${RUNNER_TEMP}/bundle/amd64/devel.json"
          bash scripts/publish_iso.sh "${RUNNER_TEMP}/bundle/arm64/devel.json"
      - name: Acquire channel writer
        if: steps.live.outputs.committed != 'true'
        env:
          R2_CREDENTIAL_BROKER_URL: ${{ vars.R2_CREDENTIAL_BROKER_URL }}
          R2_CREDENTIAL_BROKER_AUDIENCE: ${{ vars.R2_CREDENTIAL_BROKER_AUDIENCE }}
          R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: >-
          "${RUNNER_TEMP}/fsbuild" credentials acquire --broker-url "${R2_CREDENTIAL_BROKER_URL}"
          --audience "${R2_CREDENTIAL_BROKER_AUDIENCE}" --role channel-writer
          --expected-bucket "${R2_BUCKET}" --expected-prefix v1 --expected-endpoint "${R2_ENDPOINT}"
          --github-env "${GITHUB_ENV}"
      - name: Verify independently committed qualified documents before the aggregate commit point
        if: steps.live.outputs.committed != 'true'
        run: |
          set -euo pipefail
          python3 scripts/verify_multiarch_publication.py \
            --completion "${RUNNER_TEMP}/bundle/completion/payload.json" --public-base-url https://pkg.freesense.org/v1 \
            --amd64-repositories "${RUNNER_TEMP}/bundle/repositories/repos.amd64.manifest.json" \
            --arm64-repositories "${RUNNER_TEMP}/bundle/repositories/repos.aarch64.manifest.json" \
            --amd64-release "${RUNNER_TEMP}/bundle/amd64/devel.json" \
            --arm64-release "${RUNNER_TEMP}/bundle/arm64/devel.json"
      - name: Commit the complete pair atomically
        if: steps.live.outputs.committed != 'true'
        env:
          R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          FSBUILD_STORE_PREFIX: v1
          SIGNING_KEY: ${{ secrets.FREESENSE_PKG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "${SIGNING_KEY}" >"${RUNNER_TEMP}/channel.key"
          "${RUNNER_TEMP}/fsbuild" multiarch commit \
            --document "${RUNNER_TEMP}/bundle/completion/multiarch-release.json" \
            --private-key "${RUNNER_TEMP}/channel.key"
      - name: Refresh legacy amd64 aliases after the commit point
        if: steps.live.outputs.committed != 'true'
        env:
          R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          FSBUILD_STORE_PREFIX: v1
        run: |
          "${RUNNER_TEMP}/fsbuild" multiarch commit-legacy-amd64 \
            --repositories "${RUNNER_TEMP}/bundle/repositories/repos.amd64.manifest.json" \
            --release "${RUNNER_TEMP}/bundle/amd64/devel.json" \
            --public-key config/channel-signing-public.pem
