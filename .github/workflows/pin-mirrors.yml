name: Cut the mirrors for the current FreeBSD pin

# pin.yml writes a pin without mirrors, and the delta build seeds from the
# mirror (about 475 of 569 amd64 packages prebuilt instead of the smaller
# binary seed). After every rollover this cuts a mirror per architecture and
# pins it. It runs after pin.yml has usually merged; with mirrors already
# pinned it stops at the first step.
#
# Observe and Mirror are dispatched as their own runs rather than called: the
# credential broker issues mirror-writer only to a directly dispatched
# mirror.yml, and this keeps that boundary unchanged.

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      recut:
        description: Re-cut the mirrors for every architecture, even if one is pinned
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: pin-mirrors
  cancel-in-progress: false

jobs:
  mirrors:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      # A mirror must be cut knowing which ports the overlays change: those are
      # built from source. A mirror cut before an overlay existed still lists
      # the port as prebuilt and the repositories fail to compose, so a change
      # in the overlaid ports makes the pinned mirror stale.
      #
      # The Stable train builds from its own branch, whose packages and
      # overlays differ from Development's, so it has a mirror and plan of its
      # own, cut from that branch. Development's plan lists ports Stable does
      # not have (and cannot build) and lacks Stable's overlays.
      - name: Check out the ports overlays
        run: |
          set -euo pipefail
          stable_train=$(jq -er .release.stable_train config/build-policy.json)
          stable_branch="RELENG_${stable_train//./_}"
          echo "STABLE_TRAIN=${stable_train}" >>"${GITHUB_ENV}"
          echo "STABLE_BRANCH=${stable_branch}" >>"${GITHUB_ENV}"
          for repo in system-ports packages; do
            name=freesense-${repo}
            git clone --quiet --depth 1 "https://github.com/FreeSense-org/${name}.git" "${RUNNER_TEMP}/overlay-development-${repo}"
            git clone --quiet --depth 1 --branch "${stable_branch}" "https://github.com/FreeSense-org/${name}.git" "${RUNNER_TEMP}/overlay-stable-${repo}"
          done

      - id: missing
        name: Find architectures without a current mirror
        env:
          RECUT: ${{ inputs.recut || false }}
        run: |
          set -euo pipefail
          all_archs=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); from multiarch_pin import ARCHES; print(" ".join(ARCHES))')
          summary=""
          for kind in development stable; do
            overlays=(--overlay "${RUNNER_TEMP}/overlay-${kind}-system-ports" --overlay "${RUNNER_TEMP}/overlay-${kind}-packages")
            train_args=()
            [[ ${kind} == development ]] || train_args=(--train "${STABLE_TRAIN}")
            if [[ ${RECUT} == true ]]; then
              archs=${all_archs}
            else
              archs=$(python3 scripts/pin_mirrors.py "${train_args[@]}" "${overlays[@]}" missing | tr '\n' ' ' | sed 's/ *$//')
            fi
            echo "archs_${kind}=${archs}" >>"${GITHUB_OUTPUT}"
            if [[ -z ${archs} ]]; then
              echo "The ${kind} train already has a current mirror for every architecture."
            else
              echo "Cutting ${kind} mirrors for: ${archs}"
              summary+="${kind}: ${archs}; "
            fi
          done
          echo "archs=${summary}" >>"${GITHUB_OUTPUT}"
          sha256sum config/freebsd-16.json | cut -d' ' -f1 >"${RUNNER_TEMP}/pin.sha256"

      - name: Observe, then mirror, each architecture of each train
        if: steps.missing.outputs.archs != ''
        env:
          ARCHS_DEVELOPMENT: ${{ steps.missing.outputs.archs_development }}
          ARCHS_STABLE: ${{ steps.missing.outputs.archs_stable }}
        run: |
          set -euo pipefail
          # gh workflow run prints no run id. Dispatches happen one at a time,
          # so the newest dispatched run of that workflow created since just
          # before this dispatch is ours (5 s allows for clock skew).
          dispatch() {
            workflow=$1 arch=$2; shift 2
            since=$(date -u -d '-5 seconds' +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run "${workflow}" --ref main -f "architecture=${arch}" "$@" >&2
            for _ in $(seq 60); do
              sleep 10
              id=$(gh run list --workflow "${workflow}" --event workflow_dispatch --limit 20 \
                --json databaseId,createdAt \
                --jq "[.[] | select(.createdAt >= \"${since}\")] | sort_by(.createdAt) | last | .databaseId // empty")
              [[ -n ${id} ]] && { echo "${id}"; return 0; }
            done
            echo "no ${workflow} run appeared for ${arch}" >&2
            return 1
          }
          # Cut the mirrors of one train: observe every architecture, then
          # mirror every architecture, leaving the downloaded plans in
          # ${RUNNER_TEMP}/mirror-<train>-<arch>.
          cut_train() {
            kind=$1 archs=$2 source_sha=$3
            declare -A observe mirror
            for arch in ${archs}; do
              observe[${arch}]=$(dispatch observe.yml "${arch}" -f "train=${kind}")
              echo "Observe ${kind} ${arch}: run ${observe[${arch}]}"
            done
            for arch in ${archs}; do
              gh run watch "${observe[${arch}]}" --interval 60 --exit-status >/dev/null
              echo "Observe ${kind} ${arch} succeeded"
            done
            generation=$(date -u +%s)
            for arch in ${archs}; do
              mirror[${arch}]=$(dispatch mirror.yml "${arch}" \
                -f "observe_run_id=${observe[${arch}]}" -f "source_sha=${source_sha}" \
                -f "generation=${generation}" -f "train=${kind}")
              echo "Mirror ${kind} ${arch}: run ${mirror[${arch}]}"
            done
            for arch in ${archs}; do
              gh run watch "${mirror[${arch}]}" --interval 60 --exit-status >/dev/null
              echo "Mirror ${kind} ${arch} succeeded"
              gh run download "${mirror[${arch}]}" --name "mirror-${arch}" --dir "${RUNNER_TEMP}/mirror-${kind}-${arch}"
            done
          }
          # One train after the other: each observe and mirror run already
          # serializes per architecture, and the broker issues the mirror
          # credential to one mirror run at a time.
          if [[ -n ${ARCHS_DEVELOPMENT} ]]; then
            cut_train development "${ARCHS_DEVELOPMENT}" "$(gh api repos/FreeSense-org/freesense/commits/main --jq .sha)"
          fi
          if [[ -n ${ARCHS_STABLE} ]]; then
            cut_train stable "${ARCHS_STABLE}" "$(gh api "repos/FreeSense-org/freesense/commits/${STABLE_BRANCH}" --jq .sha)"
          fi
          git fetch --no-tags origin main
          git show origin/main:config/freebsd-16.json | sha256sum | cut -d' ' -f1 | cmp -s - "${RUNNER_TEMP}/pin.sha256" || {
            echo "the pin on main changed while mirrors were cut; the next run starts over" >&2
            exit 1
          }
          for kind in development stable; do
            archs_var=ARCHS_${kind^^}
            archs=${!archs_var}
            [[ -n ${archs} ]] || continue
            overlays=(--overlay "${RUNNER_TEMP}/overlay-${kind}-system-ports" --overlay "${RUNNER_TEMP}/overlay-${kind}-packages")
            train_args=()
            [[ ${kind} == development ]] || train_args=(--train "${STABLE_TRAIN}")
            args=()
            for arch in ${archs}; do
              args+=(--mirror "${arch}" "${RUNNER_TEMP}/mirror-${kind}-${arch}")
            done
            python3 scripts/pin_mirrors.py "${train_args[@]}" "${overlays[@]}" record "${args[@]}"
            python3 scripts/pin_mirrors.py "${train_args[@]}" "${overlays[@]}" missing | { ! grep -q .; }
          done

      - name: Open or update the single mirror PR
        if: steps.missing.outputs.archs != ''
        env:
          ARCHS: ${{ steps.missing.outputs.archs }}
        run: |
          set -euo pipefail
          branch=automation/freebsd-mirror
          cp config/freebsd-16.json "${RUNNER_TEMP}/freebsd-16.json"
          git config user.name freesense-ci
          git config user.email ci@freesense.org
          git checkout -- config/freebsd-16.json
          git switch -C "${branch}" origin/main
          cp "${RUNNER_TEMP}/freebsd-16.json" config/freebsd-16.json
          git add config/freebsd-16.json
          git commit -m "build: pin the mirrors cut for the current FreeBSD snapshot (${ARCHS})"
          git push --force origin "HEAD:refs/heads/${branch}"
          number=$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number // empty')
          if [[ -z "${number}" ]]; then
            gh pr create --head "${branch}" --base main \
              --title "Pin the mirrors for the current FreeBSD snapshot" \
              --body "Automated: observed the upstream ports commit and cut the frozen mirror for ${ARCHS}, then recorded each mirror's plan object, fingerprint and ports commit in the pin (pin-mirrors.yml run ${GITHUB_RUN_ID}). The delta build seeds from these mirrors."
            number=$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number')
          fi
          gh workflow run ci.yml --ref "${branch}"
          gh pr merge "${number}" --auto --squash || echo "Auto-merge could not be enabled; PR #${number} remains open for review."
          echo "Dispatched required CI and configured auto-merge for PR #${number}."
