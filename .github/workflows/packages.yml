name: Optional packages

# Optional packages is a component of the multiarch cycle, not a build of its
# own. The standalone planner and the workflow_run chain off System were retired
# with the legacy layout: the pair is reserved, built and published together by
# development-multiarch.yml.

on:
  workflow_call:
    inputs:
      multiarch_plan: {type: string, required: true}
      pair_generation: {type: string, required: true}
      suppress_publication: {type: boolean, required: true}
      target:
        type: string
        required: true
      system_fingerprint:
        type: string
        required: true
    outputs:
      packages_fingerprint:
        description: Exact immutable Optional Packages result
        value: ${{ jobs.multiarch.outputs.fingerprint }}

permissions: {actions: write, contents: read, id-token: write}
concurrency:
  group: package-planner-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  reject_invalid_pair:
    if: ${{ !inputs.suppress_publication }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Multiarch component calls must suppress mutable publication.' >&2
          exit 1

  multiarch:
    if: ${{ inputs.suppress_publication }}
    uses: ./.github/workflows/component-farm.yml
    with:
      stage: packages
      plan: ${{ inputs.multiarch_plan }}
      pair_generation: ${{ inputs.pair_generation }}
    secrets: inherit
