name: Credential broker

on:
  push:
    branches: [main]
    paths: ["broker/**", ".github/workflows/broker.yml"]
  workflow_dispatch:
    inputs:
      reset_release_storage:
        description: One-time reset of package release state and all published downloads
        type: boolean
        default: false
        required: true

permissions: {contents: read}
concurrency: {group: credential-broker, cancel-in-progress: false}

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: broker
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: "24", cache: npm, cache-dependency-path: broker/package-lock.json}
      - run: npm --prefix broker ci
      - run: npm --prefix broker test
      - run: npm --prefix broker run deploy:dry
      - run: go build -trimpath -o "${RUNNER_TEMP}/fsbuild" ./cmd/fsbuild
      - name: Validate dedicated deployment secrets
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_BROKER_API_TOKEN }}
          ACCESS_KEY: ${{ secrets.R2_BROKER_PARENT_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.R2_BROKER_PARENT_SECRET_ACCESS_KEY }}
        run: |
          [[ -n "${API_TOKEN}" ]]
          [[ "${ACCESS_KEY}" =~ ^[0-9a-f]{32}$ ]]
          [[ "${SECRET_KEY}" =~ ^[0-9a-f]{64}$ ]]
      - name: Deploy exact broker revision
        working-directory: broker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BROKER_API_TOKEN }}
          ACCESS_KEY: ${{ secrets.R2_BROKER_PARENT_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.R2_BROKER_PARENT_SECRET_ACCESS_KEY }}
          DEPLOYMENT: ${{ github.sha }}.${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          secrets=$(mktemp); trap 'rm -f "$secrets"' EXIT; chmod 600 "$secrets"
          jq -n '{R2_PARENT_ACCESS_KEY_ID:env.ACCESS_KEY,R2_PARENT_SECRET_ACCESS_KEY:env.SECRET_KEY}' >"$secrets"
          npm exec -- wrangler deploy --secrets-file "$secrets" --var "BROKER_DEPLOYMENT_ID:${DEPLOYMENT}"
      - name: Wait for this deployment
        env: {DEPLOYMENT: "${{ github.sha }}.${{ github.run_id }}.${{ github.run_attempt }}"}
        run: |
          for attempt in {1..36}; do
            response=$(curl -fsS --get --data-urlencode "deployment_id=${DEPLOYMENT}" \
              https://r2-credentials.freesense.org/healthz 2>/dev/null || true)
            jq -e --arg id "$DEPLOYMENT" '. == {status:"ok",deployment_id:$id}' <<<"$response" >/dev/null && exit 0
            sleep 5
          done
          exit 1
      - name: Acquire narrow package-bucket smoke credential
        env:
          R2_CREDENTIAL_BROKER_URL: ${{ vars.R2_CREDENTIAL_BROKER_URL }}
          R2_CREDENTIAL_BROKER_AUDIENCE: ${{ vars.R2_CREDENTIAL_BROKER_AUDIENCE }}
          R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          FSBUILD_STORE_PREFIX: v1
        run: |
          "${RUNNER_TEMP}/fsbuild" credentials acquire --broker-url "${R2_CREDENTIAL_BROKER_URL}" \
            --audience "${R2_CREDENTIAL_BROKER_AUDIENCE}" --role broker-smoke \
            --expected-bucket "${R2_BUCKET}" --expected-prefix v1 --expected-endpoint "${R2_ENDPOINT}" \
            --github-env "${GITHUB_ENV}"
      - name: Exercise narrow package-bucket smoke credential
        env: {FSBUILD_STORE_PREFIX: v1, R2_BUCKET: "${{ vars.R2_BUILD_BUCKET }}"}
        run: |
          "${RUNNER_TEMP}/fsbuild" credentials smoke --deployment-sha "${GITHUB_SHA}"
      - name: Acquire narrow downloads-bucket smoke credential
        env:
          R2_CREDENTIAL_BROKER_URL: ${{ vars.R2_CREDENTIAL_BROKER_URL }}
          R2_CREDENTIAL_BROKER_AUDIENCE: ${{ vars.R2_CREDENTIAL_BROKER_AUDIENCE }}
          R2_BUCKET: ${{ vars.R2_DOWNLOAD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          FSBUILD_STORE_PREFIX: v1
        run: |
          "${RUNNER_TEMP}/fsbuild" credentials acquire --broker-url "${R2_CREDENTIAL_BROKER_URL}" \
            --audience "${R2_CREDENTIAL_BROKER_AUDIENCE}" --role download-smoke \
            --expected-bucket "${R2_BUCKET}" --expected-prefix v1 --expected-endpoint "${R2_ENDPOINT}" \
            --github-env "${GITHUB_ENV}"
      - name: Exercise narrow downloads-bucket smoke credential
        env: {FSBUILD_STORE_PREFIX: v1, R2_BUCKET: "${{ vars.R2_DOWNLOAD_BUCKET }}"}
        run: |
          "${RUNNER_TEMP}/fsbuild" credentials smoke --deployment-sha "${GITHUB_SHA}"

  reset-release-storage:
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && inputs.reset_release_storage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: broker
    permissions: {contents: read}
    steps:
      - name: Inventory, reset, and verify both release buckets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BROKER_PARENT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BROKER_PARENT_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUILD_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
          R2_DOWNLOAD_BUCKET: ${{ vars.R2_DOWNLOAD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          [[ "${R2_BUILD_BUCKET}" == "freesense-pkg" ]]
          [[ "${R2_DOWNLOAD_BUCKET}" == "freesense-downloads" ]]
          [[ "${R2_ENDPOINT}" == "https://b82cfe18700f7455daff39e87a6a323b.r2.cloudflarestorage.com" ]]

          package_before=$(aws s3 ls "s3://${R2_BUILD_BUCKET}" --recursive --summarize \
            --human-readable --endpoint-url "${R2_ENDPOINT}" | tail -2 | tr '\n' ';')
          downloads_before=$(aws s3 ls "s3://${R2_DOWNLOAD_BUCKET}" --recursive --summarize \
            --human-readable --endpoint-url "${R2_ENDPOINT}" | tail -2 | tr '\n' ';')
          input_count_before=$(aws s3 ls "s3://${R2_BUILD_BUCKET}/v1/inputs" --recursive \
            --endpoint-url "${R2_ENDPOINT}" | wc -l | tr -d ' ')
          input_hash_before=$(aws s3 ls "s3://${R2_BUILD_BUCKET}/v1/inputs" --recursive \
            --endpoint-url "${R2_ENDPOINT}" | sha256sum | cut -d' ' -f1)
          [[ "${input_count_before}" -gt 0 ]]

          aws s3 rm "s3://${R2_BUILD_BUCKET}" --recursive --exclude 'v1/inputs/*' \
            --endpoint-url "${R2_ENDPOINT}" --only-show-errors
          aws s3 rm "s3://${R2_DOWNLOAD_BUCKET}" --recursive \
            --endpoint-url "${R2_ENDPOINT}" --only-show-errors

          input_count_after=$(aws s3 ls "s3://${R2_BUILD_BUCKET}/v1/inputs" --recursive \
            --endpoint-url "${R2_ENDPOINT}" | wc -l | tr -d ' ')
          input_hash_after=$(aws s3 ls "s3://${R2_BUILD_BUCKET}/v1/inputs" --recursive \
            --endpoint-url "${R2_ENDPOINT}" | sha256sum | cut -d' ' -f1)
          package_release_remaining=$(aws s3 ls "s3://${R2_BUILD_BUCKET}" --recursive \
            --endpoint-url "${R2_ENDPOINT}" | awk '$4 !~ /^v1\/inputs\// {count++} END {print count + 0}')
          downloads_remaining=$(aws s3 ls "s3://${R2_DOWNLOAD_BUCKET}" --recursive \
            --endpoint-url "${R2_ENDPOINT}" | wc -l | tr -d ' ')

          [[ "${input_count_after}" == "${input_count_before}" ]]
          [[ "${input_hash_after}" == "${input_hash_before}" ]]
          [[ "${package_release_remaining}" == 0 ]]
          [[ "${downloads_remaining}" == 0 ]]

          {
            echo '### One-time R2 reset'
            echo
            echo "- Package bucket before: ${package_before}"
            echo "- Downloads bucket before: ${downloads_before}"
            echo "- Preserved pinned input objects: ${input_count_after}"
            echo '- Remaining package release objects: 0'
            echo '- Remaining download objects: 0'
          } >>"${GITHUB_STEP_SUMMARY}"
