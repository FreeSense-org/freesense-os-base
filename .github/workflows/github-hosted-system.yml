name: GitHub-hosted complete System experiment

on:
  workflow_dispatch:
  push:
    branches: [experiment/github-hosted-builds]
    paths: ['scripts/github-hosted-system/**', '.github/workflows/github-hosted-system.yml']

permissions: {contents: read}
concurrency: {group: github-hosted-system-experiment, cancel-in-progress: false}

jobs:
  system:
    if: github.ref == 'refs/heads/experiment/github-hosted-builds'
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {persist-credentials: false}
      - name: Prepare disposable GitHub host
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf cloud-image-utils dosfstools mtools
          sudo chmod a+rw /dev/kvm
          nproc
          free -h
          df -h
      - name: Verify inputs and render complete System worker
        run: |
          python3 scripts/github-hosted-system/prepare.py --os-base-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/system-input"
          sh -n "$RUNNER_TEMP/system-input/worker.sh"
      - name: Build complete System in a 4-vCPU 10-GiB FreeBSD VM
        run: bash scripts/github-hosted-system/run.sh "$RUNNER_TEMP/system-input" "$RUNNER_TEMP/system-output"
      - name: Upload temporary complete System repository
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: experimental-system-full
          path: |
            ${{ runner.temp }}/system-output/system-full.json
            ${{ runner.temp }}/system-output/system-full.tar.zst.part-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Upload complete System diagnostics
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: experimental-system-full-logs
          path: |
            ${{ runner.temp }}/system-output/*.log
            ${{ runner.temp }}/system-output/*.txt
          if-no-files-found: ignore
          retention-days: 7

  verify:
    needs: system
    runs-on: ubuntu-24.04
    permissions: {actions: read, contents: read}
    steps:
      - name: Download complete System artifact
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh run download "$GITHUB_RUN_ID" --name experimental-system-full --dir "$RUNNER_TEMP/system"
      - name: Verify repository archive and descriptor
        run: |
          set -euo pipefail
          descriptor=$(find "$RUNNER_TEMP/system" -type f -name system-full.json -print -quit)
          test -n "$descriptor"
          mapfile -t parts < <(find "$RUNNER_TEMP/system" -type f -name 'system-full.tar.zst.part-*' | sort)
          test "${#parts[@]}" -gt 0
          cat "${parts[@]}" >"$RUNNER_TEMP/system-full.tar.zst"
          test "$(stat -c %s "$RUNNER_TEMP/system-full.tar.zst")" = "$(jq -er .size "$descriptor")"
          echo "$(jq -er .sha256 "$descriptor")  $RUNNER_TEMP/system-full.tar.zst" | sha256sum --check
          zstd -t "$RUNNER_TEMP/system-full.tar.zst"
          zstd -dc "$RUNNER_TEMP/system-full.tar.zst" >"$RUNNER_TEMP/system-full.tar"
          tar -tf "$RUNNER_TEMP/system-full.tar" | grep -qx './packagesite.pkg'
          count=$(tar -tf "$RUNNER_TEMP/system-full.tar" | grep -Ec '^\./All/[^/]+[.]pkg$')
          test "$count" = "$(jq -er .package_count "$descriptor")"
          printf 'Verified complete System repository with %s packages\n' "$count"
