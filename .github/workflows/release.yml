name: Release control and ISO recovery

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [verify, bundle, retry-stable-bundle, sync-downloads]
        default: verify
        required: true
      channel:
        type: choice
        options: [devel, stable]
        default: devel
        required: true
      target:
        type: choice
        options: [amd64, arm64]
        default: amd64
        required: true
      system_fingerprint:
        description: Required ARM64 System result for pre-publication image builds
        type: string
        required: false
      packages_fingerprint:
        description: Required ARM64 Packages result for pre-publication image builds
        type: string
        required: false
  workflow_run:
    workflows: [System, Optional packages]
    types: [completed]

# actions: write is required so called runner-build can upload cloud smoke failure artifacts.
permissions: {contents: read, actions: write, id-token: write}
concurrency: {group: release-control, cancel-in-progress: false}

jobs:
  release_gate:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions: {contents: read, actions: read}
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      target: ${{ steps.gate.outputs.target }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: gate
        name: Require an upstream publication and complete release pair
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t publish_states < <(
            gh api "repos/${REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID}/jobs" --paginate \
              --jq '.jobs[] | select(.name == "publish") | .conclusion'
          )
          if (( ${#publish_states[@]} != 1 )) || [[ "${publish_states[0]}" != success ]]; then
            echo "ready=false" >>"${GITHUB_OUTPUT}"
            echo "The upstream check did not publish a new component; no ISO release is needed."
            exit 0
          fi

          mkdir -p "${RUNNER_TEMP}/publication"
          gh run download "${UPSTREAM_RUN_ID}" --name publication-target \
            --dir "${RUNNER_TEMP}/publication"
          target=$(tr -d '\r\n' <"${RUNNER_TEMP}/publication/publication-target")
          [[ "${target}" == amd64 || "${target}" == arm64 ]] || {
            echo "upstream publication target is invalid" >&2; exit 1;
          }
          echo "target=${target}" >>"${GITHUB_OUTPUT}"

          public_base_url=$(jq -er .public_base_url config/build-policy.json)
          manifest="repos.manifest.json"
          [[ "${target}" == arm64 ]] && manifest="repos.aarch64.manifest.json"
          python3 scripts/channel.py --public-key config/channel-signing-public.pem \
            --url "${public_base_url}/${manifest}?workflow_run=${UPSTREAM_RUN_ID}" \
            --target "${target}" --channel devel --component system \
            --json-output "${RUNNER_TEMP}/system.json"
          if jq -e '
            .verified == "true" and
            .packages_verified == "true" and
            (.packages_generation | type == "number" and . > 0) and
            (.packages_fingerprint | test("^[0-9a-f]{64}$"))
          ' "${RUNNER_TEMP}/system.json" >/dev/null; then
            echo "ready=true" >>"${GITHUB_OUTPUT}"
            echo "The newly published channel is a complete verified release pair."
          else
            echo "ready=false" >>"${GITHUB_OUTPUT}"
            echo "The new System is waiting for optional packages from the same FreeBSD pin."
          fi

  control:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'verify'
    runs-on: ubuntu-24.04
    environment: channel-publisher
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: false}
      - run: go build -trimpath -o "${RUNNER_TEMP}/fsbuild" ./cmd/fsbuild
      - name: Prepare channel signing key
        env: {SIGNING_KEY: "${{ secrets.FREESENSE_PKG_SIGNING_KEY }}"}
        run: |
          umask 077
          printf '%s' "${SIGNING_KEY}" >"${RUNNER_TEMP}/channel.key"
          openssl pkey -in "${RUNNER_TEMP}/channel.key" -pubout -out "${RUNNER_TEMP}/channel.pub"
      - name: Acquire channel writer
        env:
          R2_CREDENTIAL_BROKER_URL: ${{ vars.R2_CREDENTIAL_BROKER_URL }}
          R2_CREDENTIAL_BROKER_AUDIENCE: ${{ vars.R2_CREDENTIAL_BROKER_AUDIENCE }}
          R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          FSBUILD_STORE_PREFIX: v1
        run: >-
          "${RUNNER_TEMP}/fsbuild" credentials acquire --broker-url "${R2_CREDENTIAL_BROKER_URL}"
          --audience "${R2_CREDENTIAL_BROKER_AUDIENCE}" --role channel-writer
          --expected-bucket "${R2_BUCKET}" --expected-prefix v1 --expected-endpoint "${R2_ENDPOINT}"
          --github-env "${GITHUB_ENV}"
      - name: Verify complete development repositories
        id: verify
        env: {R2_BUCKET: "${{ vars.R2_BUILD_BUCKET }}", FSBUILD_STORE_PREFIX: v1}
        run: >-
          bash scripts/verify-release.sh "${RUNNER_TEMP}/channel.pub"
          "${RUNNER_TEMP}/channel.key" "${RUNNER_TEMP}/fsbuild"

  sync-downloads:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'sync-downloads'
    runs-on: ubuntu-24.04
    environment: channel-publisher
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: false}
      - run: go build -trimpath -o "${RUNNER_TEMP}/fsbuild" ./cmd/fsbuild
      - name: Prepare canonical download documents
        run: python3 scripts/migrate_downloads.py --output-dir "${RUNNER_TEMP}/releases"
      - name: Acquire downloads-bucket writer
        env:
          R2_CREDENTIAL_BROKER_URL: ${{ vars.R2_CREDENTIAL_BROKER_URL }}
          R2_CREDENTIAL_BROKER_AUDIENCE: ${{ vars.R2_CREDENTIAL_BROKER_AUDIENCE }}
          R2_BUCKET: ${{ vars.R2_DOWNLOAD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: >-
          "${RUNNER_TEMP}/fsbuild" credentials acquire --broker-url "${R2_CREDENTIAL_BROKER_URL}"
          --audience "${R2_CREDENTIAL_BROKER_AUDIENCE}" --role download-writer
          --expected-bucket "${R2_BUCKET}" --expected-prefix v1 --expected-endpoint "${R2_ENDPOINT}"
          --github-env "${GITHUB_ENV}"
      - name: Publish recovered ISOs to the downloads bucket
        env:
          R2_BUCKET: ${{ vars.R2_DOWNLOAD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          shopt -s nullglob
          for file in "${RUNNER_TEMP}"/releases/*.json; do
            bash scripts/publish_iso.sh "$file"
          done
      - name: Acquire download-index writer
        env:
          R2_CREDENTIAL_BROKER_URL: ${{ vars.R2_CREDENTIAL_BROKER_URL }}
          R2_CREDENTIAL_BROKER_AUDIENCE: ${{ vars.R2_CREDENTIAL_BROKER_AUDIENCE }}
          R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: >-
          "${RUNNER_TEMP}/fsbuild" credentials acquire --broker-url "${R2_CREDENTIAL_BROKER_URL}"
          --audience "${R2_CREDENTIAL_BROKER_AUDIENCE}" --role channel-writer
          --expected-bucket "${R2_BUCKET}" --expected-prefix v1 --expected-endpoint "${R2_ENDPOINT}"
          --github-env "${GITHUB_ENV}"
      - name: Publish independent channel documents
        env:
          R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/releases"
          for channel in stable devel; do
            file="${output}/${channel}.json"
            [[ -f "${file}" ]] || continue
            aws s3 cp "${file}" "s3://${R2_BUCKET}/v1/releases/${channel}.json" \
              --endpoint-url "${R2_ENDPOINT}" --no-progress --content-type application/json \
              --cache-control 'public, max-age=60, must-revalidate'
            curl --fail --silent --show-error --location \
              "https://pkg.freesense.org/v1/releases/${channel}.json?run=${GITHUB_RUN_ID}" \
              --output "${RUNNER_TEMP}/${channel}.published.json"
            diff <(jq -S . "${file}") <(jq -S . "${RUNNER_TEMP}/${channel}.published.json")
          done
  iso-plan:
    needs: release_gate
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' &&
       (inputs.operation == 'bundle' || inputs.operation == 'retry-stable-bundle')) ||
       (github.event_name == 'workflow_run' &&
        needs.release_gate.result == 'success' && needs.release_gate.outputs.ready == 'true'))
    runs-on: ubuntu-24.04
    environment: build-coordinator
    outputs:
      fingerprint: ${{ steps.plan.outputs.iso }}
      cloud_ufs_fingerprint: ${{ steps.plan.outputs.cloud_ufs }}
      cloud_zfs_fingerprint: ${{ steps.plan.outputs.cloud_zfs }}
      bundle_fingerprint: ${{ steps.plan.outputs.bundle }}
      system: ${{ steps.plan.outputs.system }}
      generation: ${{ steps.reserve.outputs.generation }}
      system_generation: ${{ steps.plan.outputs.channel_generation }}
      platform: ${{ steps.plan.outputs.platform }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      system_sha: ${{ steps.plan.outputs.system_sha }}
      packages_sha: ${{ steps.plan.outputs.packages_sha }}
      packages_fingerprint: ${{ steps.plan.outputs.packages_fingerprint }}
      os_base_sha: ${{ steps.plan.outputs.os_base_sha }}
      freebsd_sha: ${{ steps.plan.outputs.freebsd_sha }}
      ports_sha: ${{ steps.plan.outputs.ports_sha }}
      image_sha256: ${{ steps.plan.outputs.image_sha256 }}
      worker_tools_sha256: ${{ steps.plan.outputs.worker_tools_sha256 }}
      jail_object: ${{ steps.plan.outputs.jail_object }}
      package_train: ${{ steps.plan.outputs.package_train }}
      public_base_url: ${{ steps.plan.outputs.public_base_url }}
      freebsd_pin_id: ${{ steps.plan.outputs.freebsd_pin_id }}
      product_version: ${{ steps.plan.outputs.product_version }}
      channel: ${{ steps.plan.outputs.channel }}
      release_version: ${{ steps.plan.outputs.release_version }}
      channel_payload_sha256: ${{ steps.plan.outputs.channel_payload_sha256 }}
      channel_payload_base64: ${{ steps.plan.outputs.channel_payload_base64 }}
      channel_signature_base64: ${{ steps.plan.outputs.channel_signature_base64 }}
      target: ${{ steps.plan.outputs.target }}
      architecture: ${{ steps.plan.outputs.architecture }}
      package_arch: ${{ steps.plan.outputs.package_arch }}
      freebsd_target: ${{ steps.plan.outputs.freebsd_target }}
      freebsd_target_arch: ${{ steps.plan.outputs.freebsd_target_arch }}
      poudriere_arch: ${{ steps.plan.outputs.poudriere_arch }}
      kernel: ${{ steps.plan.outputs.kernel }}
      executor: ${{ steps.plan.outputs.executor }}
      image_profile: ${{ steps.plan.outputs.image_profile }}
      firmware: ${{ steps.plan.outputs.firmware }}
      image_capabilities: ${{ steps.plan.outputs.image_capabilities }}
      installer_format: ${{ steps.plan.outputs.installer_format }}
      publish_enabled: ${{ steps.plan.outputs.publish_enabled }}
      cloud_ufs_virtual_size_gib: ${{ steps.plan.outputs.cloud_ufs_virtual_size_gib }}
      cloud_zfs_virtual_size_gib: ${{ steps.plan.outputs.cloud_zfs_virtual_size_gib }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: false}
      - name: Read signed selected channel
        env:
          SELECTED_CHANNEL: ${{ inputs.operation == 'retry-stable-bundle' && 'stable' || (github.event_name == 'workflow_dispatch' && inputs.channel || 'devel') }}
        run: |
          target="${{ github.event_name == 'workflow_dispatch' && inputs.target || needs.release_gate.outputs.target }}"
          if [[ "${target}" == arm64 && "${{ github.event_name }}" == workflow_dispatch ]]; then
            [[ "${SELECTED_CHANNEL}" == devel ]] || {
              echo "ARM64 is Development-only until a separate Stable promotion" >&2; exit 1;
            }
            system="${{ inputs.system_fingerprint }}"; packages="${{ inputs.packages_fingerprint }}"
            [[ "${system}" =~ ^[0-9a-f]{64}$ && "${packages}" =~ ^[0-9a-f]{64}$ ]] || {
              echo "ARM64 image builds require exact System and Packages fingerprints" >&2; exit 1;
            }
            public_base_url=$(jq -er .public_base_url config/build-policy.json)
            package_train=$(jq -er .package_train config/build-policy.json)
            curl --fail --silent --show-error --location \
              "${public_base_url}/artifacts/system/${system}/complete.json" -o "${RUNNER_TEMP}/system-marker.json"
            curl --fail --silent --show-error --location \
              "${public_base_url}/artifacts/packages/${package_train}/${packages}/complete.json" -o "${RUNNER_TEMP}/packages-marker.json"
            python3 scripts/staged_system_closure.py --target arm64 \
              --marker "${RUNNER_TEMP}/system-marker.json" \
              --packages-marker "${RUNNER_TEMP}/packages-marker.json" \
              --output "${RUNNER_TEMP}/system.json"
          else
            python3 scripts/channel.py --public-key config/channel-signing-public.pem \
              --target "${target}" --channel "${SELECTED_CHANNEL}" --component system \
              --json-output "${RUNNER_TEMP}/system.json"
          fi
      - id: plan
        run: |
          target="${{ github.event_name == 'workflow_dispatch' && inputs.target || needs.release_gate.outputs.target }}"
          python3 scripts/plan.py iso --target "${target}" --system-closure "${RUNNER_TEMP}/system.json" \
            --github-output "${GITHUB_OUTPUT}"
      - run: go build -trimpath -o "${RUNNER_TEMP}/fsbuild" ./cmd/fsbuild
      - name: Acquire generation coordinator
        env:
          R2_CREDENTIAL_BROKER_URL: ${{ vars.R2_CREDENTIAL_BROKER_URL }}
          R2_CREDENTIAL_BROKER_AUDIENCE: ${{ vars.R2_CREDENTIAL_BROKER_AUDIENCE }}
          R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          FSBUILD_STORE_PREFIX: v1
        run: >-
          "${RUNNER_TEMP}/fsbuild" credentials acquire --broker-url "${R2_CREDENTIAL_BROKER_URL}"
          --audience "${R2_CREDENTIAL_BROKER_AUDIENCE}" --role coordinator
          --expected-bucket "${R2_BUCKET}" --expected-prefix v1 --expected-endpoint "${R2_ENDPOINT}"
          --github-env "${GITHUB_ENV}"
      - id: reserve
        name: Reserve immutable release generation
        env:
          R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
          FSBUILD_STORE_PREFIX: v1
        run: |
          "${RUNNER_TEMP}/fsbuild" state reserve-generation \
            --fingerprint "${{ steps.plan.outputs.bundle }}" --proposed "${GITHUB_RUN_NUMBER}" \
            --output "${RUNNER_TEMP}/generation.json"
          echo "generation=$(jq -r .generation "${RUNNER_TEMP}/generation.json")" >>"${GITHUB_OUTPUT}"
      - name: Restrict recovery operation to configured sealed Stable train
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'retry-stable-bundle'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.release_version }}
          SELECTED_CHANNEL: ${{ steps.plan.outputs.channel }}
        run: |
          stable_train=$(jq -er .release.stable_train config/build-policy.json)
          [[ "${SELECTED_CHANNEL}" == stable && "${RELEASE_VERSION%.*}" == "${stable_train}" ]] || {
            echo "recovery operation requires the configured sealed Stable train" >&2
            exit 1
          }

  iso:
    needs: iso-plan
    if: always() && needs.iso-plan.result == 'success'
    uses: ./.github/workflows/runner-build.yml
    with:
      stage: iso
      fingerprint: ${{ needs.iso-plan.outputs.fingerprint }}
      platform_id: ${{ needs.iso-plan.outputs.platform }}
      system_id: ${{ needs.iso-plan.outputs.system }}
      source_sha: ${{ needs.iso-plan.outputs.source_sha }}
      system_sha: ${{ needs.iso-plan.outputs.system_sha }}
      packages_sha: ${{ needs.iso-plan.outputs.packages_sha }}
      packages_id: ${{ needs.iso-plan.outputs.packages_fingerprint }}
      os_base_sha: ${{ needs.iso-plan.outputs.os_base_sha }}
      freebsd_sha: ${{ needs.iso-plan.outputs.freebsd_sha }}
      ports_sha: ${{ needs.iso-plan.outputs.ports_sha }}
      image_sha256: ${{ needs.iso-plan.outputs.image_sha256 }}
      worker_tools_sha256: ${{ needs.iso-plan.outputs.worker_tools_sha256 }}
      jail_object: ${{ needs.iso-plan.outputs.jail_object }}
      freebsd_pin_id: ${{ needs.iso-plan.outputs.freebsd_pin_id }}
      product_version: ${{ needs.iso-plan.outputs.product_version }}
      package_train: ${{ needs.iso-plan.outputs.package_train }}
      generation: ${{ needs.iso-plan.outputs.generation }}
      system_generation: ${{ needs.iso-plan.outputs.system_generation }}
      public_base_url: ${{ needs.iso-plan.outputs.public_base_url }}
      channel: ${{ needs.iso-plan.outputs.channel }}
      channel_payload_sha256: ${{ needs.iso-plan.outputs.channel_payload_sha256 }}
      channel_payload_base64: ${{ needs.iso-plan.outputs.channel_payload_base64 }}
      channel_signature_base64: ${{ needs.iso-plan.outputs.channel_signature_base64 }}
      bundle_id: ${{ needs.iso-plan.outputs.bundle_fingerprint }}
      target: ${{ needs.iso-plan.outputs.target }}
      architecture: ${{ needs.iso-plan.outputs.architecture }}
      package_arch: ${{ needs.iso-plan.outputs.package_arch }}
      freebsd_target: ${{ needs.iso-plan.outputs.freebsd_target }}
      freebsd_target_arch: ${{ needs.iso-plan.outputs.freebsd_target_arch }}
      poudriere_arch: ${{ needs.iso-plan.outputs.poudriere_arch }}
      kernel: ${{ needs.iso-plan.outputs.kernel }}
      executor: ${{ needs.iso-plan.outputs.executor }}
      image_profile: ${{ needs.iso-plan.outputs.image_profile }}
      firmware: ${{ needs.iso-plan.outputs.firmware }}
      image_capabilities: ${{ needs.iso-plan.outputs.image_capabilities }}
      installer_format: ${{ needs.iso-plan.outputs.installer_format }}
      publish_enabled: ${{ needs.iso-plan.outputs.publish_enabled }}
    secrets: inherit

  cloud-ufs:
    needs: [iso-plan, iso]
    if: always() && needs.iso-plan.result == 'success'
    uses: ./.github/workflows/runner-build.yml
    with:
      stage: cloud
      fingerprint: ${{ needs.iso-plan.outputs.cloud_ufs_fingerprint }}
      platform_id: ${{ needs.iso-plan.outputs.platform }}
      system_id: ${{ needs.iso-plan.outputs.system }}
      source_sha: ${{ needs.iso-plan.outputs.source_sha }}
      system_sha: ${{ needs.iso-plan.outputs.system_sha }}
      packages_sha: ${{ needs.iso-plan.outputs.packages_sha }}
      packages_id: ${{ needs.iso-plan.outputs.packages_fingerprint }}
      os_base_sha: ${{ needs.iso-plan.outputs.os_base_sha }}
      freebsd_sha: ${{ needs.iso-plan.outputs.freebsd_sha }}
      ports_sha: ${{ needs.iso-plan.outputs.ports_sha }}
      image_sha256: ${{ needs.iso-plan.outputs.image_sha256 }}
      worker_tools_sha256: ${{ needs.iso-plan.outputs.worker_tools_sha256 }}
      jail_object: ${{ needs.iso-plan.outputs.jail_object }}
      freebsd_pin_id: ${{ needs.iso-plan.outputs.freebsd_pin_id }}
      product_version: ${{ needs.iso-plan.outputs.product_version }}
      package_train: ${{ needs.iso-plan.outputs.package_train }}
      generation: ${{ needs.iso-plan.outputs.generation }}
      system_generation: ${{ needs.iso-plan.outputs.system_generation }}
      public_base_url: ${{ needs.iso-plan.outputs.public_base_url }}
      channel: ${{ needs.iso-plan.outputs.channel }}
      channel_payload_sha256: ${{ needs.iso-plan.outputs.channel_payload_sha256 }}
      channel_payload_base64: ${{ needs.iso-plan.outputs.channel_payload_base64 }}
      channel_signature_base64: ${{ needs.iso-plan.outputs.channel_signature_base64 }}
      bundle_id: ${{ needs.iso-plan.outputs.bundle_fingerprint }}
      target: ${{ needs.iso-plan.outputs.target }}
      architecture: ${{ needs.iso-plan.outputs.architecture }}
      package_arch: ${{ needs.iso-plan.outputs.package_arch }}
      freebsd_target: ${{ needs.iso-plan.outputs.freebsd_target }}
      freebsd_target_arch: ${{ needs.iso-plan.outputs.freebsd_target_arch }}
      poudriere_arch: ${{ needs.iso-plan.outputs.poudriere_arch }}
      kernel: ${{ needs.iso-plan.outputs.kernel }}
      executor: ${{ needs.iso-plan.outputs.executor }}
      image_profile: ${{ needs.iso-plan.outputs.image_profile }}
      firmware: ${{ needs.iso-plan.outputs.firmware }}
      image_capabilities: ${{ needs.iso-plan.outputs.image_capabilities }}
      installer_format: ${{ needs.iso-plan.outputs.installer_format }}
      publish_enabled: ${{ needs.iso-plan.outputs.publish_enabled }}
      cloud_filesystem: ufs
      cloud_virtual_size_gib: ${{ needs.iso-plan.outputs.cloud_ufs_virtual_size_gib }}
    secrets: inherit

  cloud-zfs:
    needs: [iso-plan, cloud-ufs]
    if: always() && needs.iso-plan.result == 'success'
    uses: ./.github/workflows/runner-build.yml
    with:
      stage: cloud
      fingerprint: ${{ needs.iso-plan.outputs.cloud_zfs_fingerprint }}
      platform_id: ${{ needs.iso-plan.outputs.platform }}
      system_id: ${{ needs.iso-plan.outputs.system }}
      source_sha: ${{ needs.iso-plan.outputs.source_sha }}
      system_sha: ${{ needs.iso-plan.outputs.system_sha }}
      packages_sha: ${{ needs.iso-plan.outputs.packages_sha }}
      packages_id: ${{ needs.iso-plan.outputs.packages_fingerprint }}
      os_base_sha: ${{ needs.iso-plan.outputs.os_base_sha }}
      freebsd_sha: ${{ needs.iso-plan.outputs.freebsd_sha }}
      ports_sha: ${{ needs.iso-plan.outputs.ports_sha }}
      image_sha256: ${{ needs.iso-plan.outputs.image_sha256 }}
      worker_tools_sha256: ${{ needs.iso-plan.outputs.worker_tools_sha256 }}
      jail_object: ${{ needs.iso-plan.outputs.jail_object }}
      freebsd_pin_id: ${{ needs.iso-plan.outputs.freebsd_pin_id }}
      product_version: ${{ needs.iso-plan.outputs.product_version }}
      package_train: ${{ needs.iso-plan.outputs.package_train }}
      generation: ${{ needs.iso-plan.outputs.generation }}
      system_generation: ${{ needs.iso-plan.outputs.system_generation }}
      public_base_url: ${{ needs.iso-plan.outputs.public_base_url }}
      channel: ${{ needs.iso-plan.outputs.channel }}
      channel_payload_sha256: ${{ needs.iso-plan.outputs.channel_payload_sha256 }}
      channel_payload_base64: ${{ needs.iso-plan.outputs.channel_payload_base64 }}
      channel_signature_base64: ${{ needs.iso-plan.outputs.channel_signature_base64 }}
      bundle_id: ${{ needs.iso-plan.outputs.bundle_fingerprint }}
      target: ${{ needs.iso-plan.outputs.target }}
      architecture: ${{ needs.iso-plan.outputs.architecture }}
      package_arch: ${{ needs.iso-plan.outputs.package_arch }}
      freebsd_target: ${{ needs.iso-plan.outputs.freebsd_target }}
      freebsd_target_arch: ${{ needs.iso-plan.outputs.freebsd_target_arch }}
      poudriere_arch: ${{ needs.iso-plan.outputs.poudriere_arch }}
      kernel: ${{ needs.iso-plan.outputs.kernel }}
      executor: ${{ needs.iso-plan.outputs.executor }}
      image_profile: ${{ needs.iso-plan.outputs.image_profile }}
      firmware: ${{ needs.iso-plan.outputs.firmware }}
      image_capabilities: ${{ needs.iso-plan.outputs.image_capabilities }}
      installer_format: ${{ needs.iso-plan.outputs.installer_format }}
      publish_enabled: ${{ needs.iso-plan.outputs.publish_enabled }}
      cloud_filesystem: zfs
      cloud_virtual_size_gib: ${{ needs.iso-plan.outputs.cloud_zfs_virtual_size_gib }}
    secrets: inherit

  publish-download:
    needs: [iso-plan, iso, cloud-ufs, cloud-zfs]
    runs-on: ubuntu-24.04
    environment: channel-publisher
    if: needs.iso-plan.outputs.publish_enabled == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: false}
      - run: go build -trimpath -o "${RUNNER_TEMP}/fsbuild" ./cmd/fsbuild
      - name: Prepare release document
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_download.py --channel "${{ needs.iso-plan.outputs.channel }}" \
            --target "${{ needs.iso-plan.outputs.target }}" \
            --image-profile "${{ needs.iso-plan.outputs.image_profile }}" \
            --version "${{ needs.iso-plan.outputs.release_version }}" \
            --fingerprint "${{ needs.iso-plan.outputs.fingerprint }}" \
            --bundle-fingerprint "${{ needs.iso-plan.outputs.bundle_fingerprint }}" \
            --cloud-ufs-fingerprint "${{ needs.iso-plan.outputs.cloud_ufs_fingerprint }}" \
            --cloud-zfs-fingerprint "${{ needs.iso-plan.outputs.cloud_zfs_fingerprint }}" \
            --system "${{ needs.iso-plan.outputs.system }}" \
            --generation "${{ needs.iso-plan.outputs.generation }}" \
            --source "${{ needs.iso-plan.outputs.source_sha }}" \
            --system-ports "${{ needs.iso-plan.outputs.system_sha }}" \
            --packages "${{ needs.iso-plan.outputs.packages_sha }}" \
            --packages-fingerprint "${{ needs.iso-plan.outputs.packages_fingerprint }}" \
            --ports "${{ needs.iso-plan.outputs.ports_sha }}" \
            --os-definition "${{ needs.iso-plan.outputs.os_base_sha }}" \
            --freebsd "${{ needs.iso-plan.outputs.freebsd_sha }}" \
            --output "${RUNNER_TEMP}/${{ needs.iso-plan.outputs.channel }}.json"
      - name: Acquire downloads-bucket writer
        env:
          R2_CREDENTIAL_BROKER_URL: ${{ vars.R2_CREDENTIAL_BROKER_URL }}
          R2_CREDENTIAL_BROKER_AUDIENCE: ${{ vars.R2_CREDENTIAL_BROKER_AUDIENCE }}
          R2_BUCKET: ${{ vars.R2_DOWNLOAD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: >-
          "${RUNNER_TEMP}/fsbuild" credentials acquire --broker-url "${R2_CREDENTIAL_BROKER_URL}"
          --audience "${R2_CREDENTIAL_BROKER_AUDIENCE}" --role download-writer
          --expected-bucket "${R2_BUCKET}" --expected-prefix v1 --expected-endpoint "${R2_ENDPOINT}"
          --github-env "${GITHUB_ENV}"
      - name: Publish boot-tested ISO to downloads
        env:
          R2_BUCKET: ${{ vars.R2_DOWNLOAD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: bash scripts/publish_iso.sh "${RUNNER_TEMP}/${{ needs.iso-plan.outputs.channel }}.json"
      - name: Acquire download-index writer
        env:
          R2_CREDENTIAL_BROKER_URL: ${{ vars.R2_CREDENTIAL_BROKER_URL }}
          R2_CREDENTIAL_BROKER_AUDIENCE: ${{ vars.R2_CREDENTIAL_BROKER_AUDIENCE }}
          R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: >-
          "${RUNNER_TEMP}/fsbuild" credentials acquire --broker-url "${R2_CREDENTIAL_BROKER_URL}"
          --audience "${R2_CREDENTIAL_BROKER_AUDIENCE}" --role channel-writer
          --expected-bucket "${R2_BUCKET}" --expected-prefix v1 --expected-endpoint "${R2_ENDPOINT}"
          --github-env "${GITHUB_ENV}"
      - name: Publish release document after downloads verification
        env:
          R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          qualified="${{ needs.iso-plan.outputs.channel }}.${{ needs.iso-plan.outputs.architecture }}.json"
          aws s3 cp "${RUNNER_TEMP}/${{ needs.iso-plan.outputs.channel }}.json" \
            "s3://${R2_BUCKET}/v1/releases/${qualified}" \
            --endpoint-url "${R2_ENDPOINT}" --no-progress --content-type application/json \
            --cache-control 'public, max-age=60, must-revalidate'
          curl --fail --silent --show-error --location \
            "https://pkg.freesense.org/v1/releases/${qualified}?run=${GITHUB_RUN_ID}" \
            --output "${RUNNER_TEMP}/published.json"
          diff <(jq -S . "${RUNNER_TEMP}/${{ needs.iso-plan.outputs.channel }}.json") \
            <(jq -S . "${RUNNER_TEMP}/published.json")
          if [[ "${{ needs.iso-plan.outputs.architecture }}" == amd64 ]]; then
            aws s3 cp "${RUNNER_TEMP}/${{ needs.iso-plan.outputs.channel }}.json" \
              "s3://${R2_BUCKET}/v1/releases/${{ needs.iso-plan.outputs.channel }}.json" \
              --endpoint-url "${R2_ENDPOINT}" --no-progress --content-type application/json \
              --cache-control 'public, max-age=60, must-revalidate'
          fi
