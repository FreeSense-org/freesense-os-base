name: Verify, promote, or build ISO

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [verify, iso]
        default: verify
        required: true
      channel:
        type: choice
        options: [devel, stable]
        default: devel
        required: true
  workflow_run:
    workflows: [System, Optional packages]
    types: [completed]

permissions: {contents: read, id-token: write}
concurrency: {group: release-control, cancel-in-progress: false}

jobs:
  control:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'verify'
    runs-on: ubuntu-24.04
    environment: channel-publisher
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: false}
      - run: go build -trimpath -o "${RUNNER_TEMP}/fsbuild" ./cmd/fsbuild
      - name: Prepare channel signing key
        env: {SIGNING_KEY: "${{ secrets.FREESENSE_PKG_SIGNING_KEY }}"}
        run: |
          umask 077
          printf '%s' "${SIGNING_KEY}" >"${RUNNER_TEMP}/channel.key"
          openssl pkey -in "${RUNNER_TEMP}/channel.key" -pubout -out "${RUNNER_TEMP}/channel.pub"
      - name: Acquire channel writer
        env:
          R2_CREDENTIAL_BROKER_URL: ${{ vars.R2_CREDENTIAL_BROKER_URL }}
          R2_CREDENTIAL_BROKER_AUDIENCE: ${{ vars.R2_CREDENTIAL_BROKER_AUDIENCE }}
          R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          FSBUILD_STORE_PREFIX: v1
        run: >-
          "${RUNNER_TEMP}/fsbuild" credentials acquire --broker-url "${R2_CREDENTIAL_BROKER_URL}"
          --audience "${R2_CREDENTIAL_BROKER_AUDIENCE}" --role channel-writer
          --expected-bucket "${R2_BUCKET}" --expected-prefix v1 --expected-endpoint "${R2_ENDPOINT}"
          --github-env "${GITHUB_ENV}"
      - name: Verify complete development repositories
        id: verify
        env: {R2_BUCKET: "${{ vars.R2_BUILD_BUCKET }}", FSBUILD_STORE_PREFIX: v1}
        run: >-
          bash scripts/verify-release.sh "${RUNNER_TEMP}/channel.pub"
          "${RUNNER_TEMP}/channel.key" "${RUNNER_TEMP}/fsbuild"
  iso-plan:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'iso') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    environment: build-coordinator
    outputs:
      fingerprint: ${{ steps.plan.outputs.iso }}
      system: ${{ steps.plan.outputs.system }}
      generation: ${{ steps.plan.outputs.channel_generation }}
      platform: ${{ steps.plan.outputs.platform }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      system_sha: ${{ steps.plan.outputs.system_sha }}
      packages_sha: ${{ steps.plan.outputs.packages_sha }}
      os_base_sha: ${{ steps.plan.outputs.os_base_sha }}
      freebsd_sha: ${{ steps.plan.outputs.freebsd_sha }}
      ports_sha: ${{ steps.plan.outputs.ports_sha }}
      image_sha256: ${{ steps.plan.outputs.image_sha256 }}
      worker_tools_sha256: ${{ steps.plan.outputs.worker_tools_sha256 }}
      jail_object: ${{ steps.plan.outputs.jail_object }}
      package_train: ${{ steps.plan.outputs.package_train }}
      public_base_url: ${{ steps.plan.outputs.public_base_url }}
      freebsd_pin_id: ${{ steps.plan.outputs.freebsd_pin_id }}
      product_version: ${{ steps.plan.outputs.product_version }}
      channel: ${{ steps.plan.outputs.channel }}
      release_version: ${{ steps.plan.outputs.release_version }}
      channel_payload_sha256: ${{ steps.plan.outputs.channel_payload_sha256 }}
      channel_payload_base64: ${{ steps.plan.outputs.channel_payload_base64 }}
      channel_signature_base64: ${{ steps.plan.outputs.channel_signature_base64 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Read signed selected channel
        run: |
          python3 scripts/channel.py --public-key config/channel-signing-public.pem \
            --channel "${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'devel' }}" --component system \
            --json-output "${RUNNER_TEMP}/system.json"
      - id: plan
        run: >-
          python3 scripts/plan.py iso --system-closure "${RUNNER_TEMP}/system.json"
          --github-output "${GITHUB_OUTPUT}"

  iso:
    needs: iso-plan
    uses: ./.github/workflows/runner-build.yml
    with:
      stage: iso
      fingerprint: ${{ needs.iso-plan.outputs.fingerprint }}
      platform_id: ${{ needs.iso-plan.outputs.platform }}
      system_id: ${{ needs.iso-plan.outputs.system }}
      source_sha: ${{ needs.iso-plan.outputs.source_sha }}
      system_sha: ${{ needs.iso-plan.outputs.system_sha }}
      packages_sha: ${{ needs.iso-plan.outputs.packages_sha }}
      os_base_sha: ${{ needs.iso-plan.outputs.os_base_sha }}
      freebsd_sha: ${{ needs.iso-plan.outputs.freebsd_sha }}
      ports_sha: ${{ needs.iso-plan.outputs.ports_sha }}
      image_sha256: ${{ needs.iso-plan.outputs.image_sha256 }}
      worker_tools_sha256: ${{ needs.iso-plan.outputs.worker_tools_sha256 }}
      jail_object: ${{ needs.iso-plan.outputs.jail_object }}
      freebsd_pin_id: ${{ needs.iso-plan.outputs.freebsd_pin_id }}
      product_version: ${{ needs.iso-plan.outputs.product_version }}
      package_train: ${{ needs.iso-plan.outputs.package_train }}
      generation: ${{ needs.iso-plan.outputs.generation }}
      public_base_url: ${{ needs.iso-plan.outputs.public_base_url }}
      channel: ${{ needs.iso-plan.outputs.channel }}
      channel_payload_sha256: ${{ needs.iso-plan.outputs.channel_payload_sha256 }}
      channel_payload_base64: ${{ needs.iso-plan.outputs.channel_payload_base64 }}
      channel_signature_base64: ${{ needs.iso-plan.outputs.channel_signature_base64 }}
    secrets: inherit

  publish-download:
    needs: [iso-plan, iso]
    runs-on: ubuntu-24.04
    environment: channel-publisher
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version-file: go.mod, cache: false}
      - run: go build -trimpath -o "${RUNNER_TEMP}/fsbuild" ./cmd/fsbuild
      - name: Acquire download-index writer
        env:
          R2_CREDENTIAL_BROKER_URL: ${{ vars.R2_CREDENTIAL_BROKER_URL }}
          R2_CREDENTIAL_BROKER_AUDIENCE: ${{ vars.R2_CREDENTIAL_BROKER_AUDIENCE }}
          R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: >-
          "${RUNNER_TEMP}/fsbuild" credentials acquire --broker-url "${R2_CREDENTIAL_BROKER_URL}"
          --audience "${R2_CREDENTIAL_BROKER_AUDIENCE}" --role channel-writer
          --expected-bucket "${R2_BUCKET}" --expected-prefix v1 --expected-endpoint "${R2_ENDPOINT}"
          --github-env "${GITHUB_ENV}"
      - name: Publish website release feed after boot smoke
        env:
          R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          python3 scripts/publish_download.py --channel "${{ needs.iso-plan.outputs.channel }}" \
            --version "${{ needs.iso-plan.outputs.release_version }}" \
            --fingerprint "${{ needs.iso-plan.outputs.fingerprint }}" \
            --system "${{ needs.iso-plan.outputs.system }}" \
            --generation "${{ needs.iso-plan.outputs.generation }}" \
            --source "${{ needs.iso-plan.outputs.source_sha }}" --ports "${{ needs.iso-plan.outputs.ports_sha }}" \
            --os-definition "${GITHUB_SHA}" --freebsd "${{ needs.iso-plan.outputs.freebsd_sha }}" \
            --output "${RUNNER_TEMP}/releases.json"
          aws s3 cp "${RUNNER_TEMP}/releases.json" "s3://${R2_BUCKET}/v1/releases.json" \
            --endpoint-url "${R2_ENDPOINT}" --no-progress --content-type application/json \
            --cache-control 'public, max-age=60, must-revalidate'
