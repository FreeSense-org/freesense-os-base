name: Pin FreeBSD

on:
  workflow_dispatch:
    inputs:
      security_rollover:
        description: Rotate early for an explicitly identified security issue
        type: boolean
        default: false
        required: false
      security_reference:
        description: Required advisory or issue URL for an early security rollover
        type: string
        default: ''
        required: false
  schedule:
    - cron: "0 2 * * *"

permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: pin-freebsd-16
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: pin
    permissions:
      contents: read
    env:
      SECURITY_ROLLOVER: ${{ inputs.security_rollover || false }}
      SECURITY_REFERENCE: ${{ inputs.security_reference || '' }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      due: ${{ steps.window.outputs.due }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - name: Check the 14-day pin window
        id: window
        shell: bash
        run: |
          set -euo pipefail
          valid_until=$(jq -er .valid_until config/freebsd-16.json)
          due_at=$(date -u --date="${valid_until} - 4 hours" +%s)
          if [[ "${SECURITY_ROLLOVER}" == true ]]; then
            [[ "${SECURITY_REFERENCE}" =~ ^https://[^[:space:]]+$ ]] || {
              echo "Early security rollover requires an advisory or issue URL." >&2
              exit 1
            }
            echo "due=true" >>"${GITHUB_OUTPUT}"
            echo "Explicit security rollover requested: ${SECURITY_REFERENCE}"
          elif (( $(date -u +%s) >= due_at )); then
            echo "due=true" >>"${GITHUB_OUTPUT}"
          else
            echo "due=false" >>"${GITHUB_OUTPUT}"
            echo "FreeBSD remains pinned through ${valid_until}."
          fi

      - name: Resolve shared snapshot metadata and freeze FreeSense source commits
        if: steps.window.outputs.due == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DIST_AMD64="https://download.freebsd.org/snapshots/amd64/16.0-CURRENT"
          DIST_ARM64="https://download.freebsd.org/snapshots/arm64/16.0-CURRENT"
          VM_AMD64="https://download.freebsd.org/snapshots/VM-IMAGES/16.0-CURRENT/amd64/Latest"
          VM_ARM64="https://download.freebsd.org/snapshots/VM-IMAGES/16.0-CURRENT/arm64/Latest"

          downloads="${RUNNER_TEMP}/downloads"
          mkdir -p "${downloads}/amd64" "${downloads}/arm64" "${RUNNER_TEMP}/pin-common"

          retry=(--fail --location --silent --show-error --retry 5 --retry-all-errors --proto '=https')

          curl "${retry[@]}" -o "${downloads}/amd64/MANIFEST" "${DIST_AMD64}/MANIFEST"
          curl "${retry[@]}" -o "${downloads}/arm64/MANIFEST" "${DIST_ARM64}/MANIFEST"

          curl "${retry[@]}" -o "${downloads}/amd64/CHECKSUM.SHA256" "${VM_AMD64}/CHECKSUM.SHA256"
          curl "${retry[@]}" -o "${downloads}/arm64/CHECKSUM.SHA256" "${VM_ARM64}/CHECKSUM.SHA256"

          curl "${retry[@]}" -o "${downloads}/amd64/packagesite.pkg" "https://pkg.freebsd.org/FreeBSD:16:amd64/latest/packagesite.pkg"
          curl "${retry[@]}" -o "${downloads}/arm64/packagesite.pkg" "https://pkg.freebsd.org/FreeBSD:16:aarch64/latest/packagesite.pkg"

          amd_revision=$(curl "${retry[@]}" "${DIST_AMD64}/REVISION" | tr -d '\r\n')
          amd_builddate=$(curl "${retry[@]}" "${DIST_AMD64}/BUILDDATE" | tr -d '\r\n')
          arm_revision=$(curl "${retry[@]}" "${DIST_ARM64}/REVISION" | tr -d '\r\n')
          arm_builddate=$(curl "${retry[@]}" "${DIST_ARM64}/BUILDDATE" | tr -d '\r\n')

          if [[ "${amd_revision}" != "${arm_revision}" || "${amd_builddate}" != "${arm_builddate}" ]]; then
            echo "Snapshot mismatch: amd64 (${amd_revision}, ${amd_builddate}) vs arm64 (${arm_revision}, ${arm_builddate})" >&2
            exit 1
          fi

          revision="${amd_revision}"
          builddate="${amd_builddate}"
          [[ "${revision}" =~ ^[0-9a-f]{12}$ ]]
          [[ "${builddate}" =~ ^[0-9]{8}$ ]]

          source_sha=$(gh api "repos/freebsd/freebsd-src/commits/${revision}" --jq .sha)
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]

          curl "${retry[@]}" -o "${RUNNER_TEMP}/param.h" \
            "https://raw.githubusercontent.com/freebsd/freebsd-src/${source_sha}/sys/sys/param.h"
          osversion=$(awk '/^#[[:space:]]*define[[:space:]]+__FreeBSD_version[[:space:]]+/ {print $3}' \
            "${RUNNER_TEMP}/param.h")
          [[ "${osversion}" =~ ^16[0-9]{5}$ ]]

          curl "${retry[@]}" -o "${RUNNER_TEMP}/trusted_key" \
            "https://raw.githubusercontent.com/freebsd/freebsd-src/${source_sha}/share/keys/pkg/trusted/pkg.freebsd.org.2013102301"
          trusted_key_sha256=$(sed -nE 's/^fingerprint: "([0-9a-f]{64})"$/\1/p' "${RUNNER_TEMP}/trusted_key")
          [[ "${trusted_key_sha256}" =~ ^[0-9a-f]{64}$ ]]

          freesense_sha=$(gh api repos/FreeSense-org/freesense/commits/main --jq .sha)
          system_ports_sha=$(gh api repos/FreeSense-org/freesense-system-ports/commits/main --jq .sha)
          packages_sha=$(gh api repos/FreeSense-org/freesense-packages/commits/main --jq .sha)
          os_base_sha="${GITHUB_SHA}"

          [[ "${freesense_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${system_ports_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${packages_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${os_base_sha}" =~ ^[0-9a-f]{40}$ ]]

          jq -n \
            --arg revision "${revision}" \
            --arg build_date "${builddate}" \
            --arg source_commit "${source_sha}" \
            --argjson osversion "${osversion}" \
            --arg trusted_key_sha256 "${trusted_key_sha256}" \
            --arg dist_amd64 "${DIST_AMD64}" \
            --arg dist_arm64 "${DIST_ARM64}" \
            --arg vm_amd64 "${VM_AMD64}" \
            --arg vm_arm64 "${VM_ARM64}" \
            '{revision: $revision, build_date: $build_date, source_commit: $source_commit,
              osversion: $osversion, trusted_key_sha256: $trusted_key_sha256,
              dist_urls: {amd64: $dist_amd64, arm64: $dist_arm64},
              vm_urls: {amd64: $vm_amd64, arm64: $vm_arm64}}' >"${RUNNER_TEMP}/metadata.json"

          jq -n \
            --arg freesense "${freesense_sha}" \
            --arg system_ports "${system_ports_sha}" \
            --arg packages "${packages_sha}" \
            --arg os_base "${os_base_sha}" \
            '{freesense: $freesense, system_ports: $system_ports, packages: $packages, os_base: $os_base}' \
            >"${RUNNER_TEMP}/sources.json"

          extra_flags=()
          if [[ "${SECURITY_ROLLOVER}" == true ]]; then
            extra_flags+=(--security-rollover)
          fi

          python3 scripts/resolve_multiarch_pin.py \
            --previous config/freebsd-16.json \
            --directory "${downloads}" \
            --metadata "${RUNNER_TEMP}/metadata.json" \
            --sources "${RUNNER_TEMP}/sources.json" \
            --output "${RUNNER_TEMP}/pin-common/common.json" \
            "${extra_flags[@]}"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: steps.window.outputs.due == 'true'
        with:
          name: freebsd-pin-common
          path: ${{ runner.temp }}/pin-common/common.json
          if-no-files-found: error
          retention-days: 14

  target_amd64:
    needs: resolve
    if: needs.resolve.outputs.due == 'true'
    uses: ./.github/workflows/pin-target.yml
    with:
      architecture: amd64
    secrets: inherit

  target_arm64:
    needs: resolve
    if: needs.resolve.outputs.due == 'true'
    uses: ./.github/workflows/pin-target.yml
    with:
      architecture: arm64
    secrets: inherit

  finalize:
    needs: [resolve, target_amd64, target_arm64]
    if: needs.resolve.outputs.due == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: pin
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: write
    env:
      SECURITY_ROLLOVER: ${{ inputs.security_rollover || false }}
      R2_CREDENTIAL_BROKER_URL: ${{ vars.R2_CREDENTIAL_BROKER_URL }}
      R2_CREDENTIAL_BROKER_AUDIENCE: ${{ vars.R2_CREDENTIAL_BROKER_AUDIENCE }}
      R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      FSBUILD_STORE_PREFIX: v1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Build coordinator
        run: go build -trimpath -o "${RUNNER_TEMP}/fsbuild" ./cmd/fsbuild

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: freebsd-pin-common
          path: ${{ runner.temp }}/pin-common

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: freebsd-pin-amd64
          path: ${{ runner.temp }}/pin-amd64

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: freebsd-pin-arm64
          path: ${{ runner.temp }}/pin-arm64

      - name: Acquire short-lived pin credentials
        run: >-
          "${RUNNER_TEMP}/fsbuild" credentials acquire
          --broker-url "${R2_CREDENTIAL_BROKER_URL}"
          --audience "${R2_CREDENTIAL_BROKER_AUDIENCE}"
          --role pin-writer
          --expected-bucket "${R2_BUCKET}"
          --expected-prefix v1
          --expected-endpoint "${R2_ENDPOINT}"
          --github-env "${GITHUB_ENV}"

      - name: Assemble multiarch candidate pin and verify mirrored inputs
        run: |
          set -euo pipefail
          extra_flags=()
          if [[ "${SECURITY_ROLLOVER}" == true ]]; then
            extra_flags+=(--security-rollover)
          fi
          python3 scripts/assemble_multiarch_pin.py \
            --previous config/freebsd-16.json \
            --common "${RUNNER_TEMP}/pin-common/common.json" \
            --amd64 "${RUNNER_TEMP}/pin-amd64/report.json" \
            --arm64 "${RUNNER_TEMP}/pin-arm64/report.json" \
            --fsbuild "${RUNNER_TEMP}/fsbuild" \
            --output "${RUNNER_TEMP}/freebsd-16.json" \
            "${extra_flags[@]}"

      - name: Open or update the single pin PR
        run: |
          set -euo pipefail
          pin_file="${RUNNER_TEMP}/freebsd-16.json"
          if cmp -s "${pin_file}" config/freebsd-16.json; then
            echo "The current pin is already exact; no branch or PR created."
            exit 0
          fi
          branch=automation/freebsd-pin
          git config user.name freesense-ci
          git config user.email ci@freesense.org
          git fetch --no-tags origin main
          if git ls-remote --exit-code --heads origin "${branch}"; then
            git fetch --no-tags origin "${branch}"
            git switch "${branch}"
            git merge --no-edit origin/main || {
              git merge --abort
              git switch -C "${branch}" origin/main
            }
          else
            git switch -c "${branch}" origin/main
          fi
          cp "${pin_file}" config/freebsd-16.json
          git add config/freebsd-16.json
          if git diff --staged --quiet; then
            echo "No content changes relative to ${branch}."
            exit 0
          fi
          git commit -m "build: pin official FreeBSD 16 snapshot"
          git push origin "HEAD:refs/heads/${branch}"
          number=$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number // empty')
          if [[ -z "${number}" ]]; then
            gh pr create --head "${branch}" --base main \
              --title "Pin the current official FreeBSD 16 snapshot" \
              --body "Automated checksum-verified dual-architecture FreeBSD source, jail seeds, KVM worker images, official binary package seeds, and signed-catalog worker-tool closures for amd64 and arm64. The fixed branch is reused; pinning never creates tag or branch sprawl."
            number=$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number')
            echo "Created pin PR #${number}"
          else
            echo "Updated pin PR #${number}"
          fi
          gh workflow run ci.yml --ref "${branch}"
          gh pr merge "${number}" --auto --squash
          echo "Dispatched required CI and configured auto-merge for PR #${number}."

      - name: Clean pinning downloads
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/downloads" "${RUNNER_TEMP}/pin-common" \
            "${RUNNER_TEMP}/pin-amd64" "${RUNNER_TEMP}/pin-arm64" \
            "${RUNNER_TEMP}/freebsd-16.json" "${RUNNER_TEMP}/metadata.json" \
            "${RUNNER_TEMP}/sources.json" "${RUNNER_TEMP}/param.h" \
            "${RUNNER_TEMP}/trusted_key"
