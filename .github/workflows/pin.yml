name: Pin FreeBSD

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * 1"

permissions:
  contents: read

concurrency:
  group: pin-freebsd-16
  cancel-in-progress: false

jobs:
  pin:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, build-runner]
    concurrency:
      group: freesense-kvm-host
      cancel-in-progress: false
    timeout-minutes: 120
    environment: pin
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: write
    env:
      R2_CREDENTIAL_BROKER_URL: ${{ vars.R2_CREDENTIAL_BROKER_URL }}
      R2_CREDENTIAL_BROKER_AUDIENCE: ${{ vars.R2_CREDENTIAL_BROKER_AUDIENCE }}
      R2_BUCKET: ${{ vars.R2_BUILD_BUCKET }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      FSBUILD_STORE_PREFIX: v1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install image tools
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq qemu-system-x86 qemu-utils cloud-image-utils ovmf xz-utils zstd jq gh
          go build -trimpath -o "${RUNNER_TEMP}/fsbuild" ./cmd/fsbuild

      - name: Acquire short-lived pin credentials
        run: >-
          "${RUNNER_TEMP}/fsbuild" credentials acquire
          --broker-url "${R2_CREDENTIAL_BROKER_URL}"
          --audience "${R2_CREDENTIAL_BROKER_AUDIENCE}"
          --role pin-writer
          --expected-bucket "${R2_BUCKET}"
          --expected-prefix v1
          --expected-endpoint "${R2_ENDPOINT}"
          --github-env "${GITHUB_ENV}"

      - name: Verify and mirror one official weekly snapshot
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          DIST=https://download.freebsd.org/snapshots/amd64/16.0-CURRENT
          VM=https://download.freebsd.org/snapshots/VM-IMAGES/16.0-CURRENT/amd64/Latest

          retry=(--fail --location --silent --show-error --retry 5 --retry-all-errors)
          curl "${retry[@]}" -o "${RUNNER_TEMP}/MANIFEST" "${DIST}/MANIFEST"
          revision=$(curl "${retry[@]}" "${DIST}/REVISION" | tr -d '\r\n')
          builddate=$(curl "${retry[@]}" "${DIST}/BUILDDATE" | tr -d '\r\n')
          [[ "${revision}" =~ ^[0-9a-f]{12}$ ]]
          [[ "${builddate}" =~ ^[0-9]{8}$ ]]
          freebsd_sha=$(gh api "repos/freebsd/freebsd-src/commits/${revision}" --jq .sha)
          [[ "${freebsd_sha}" =~ ^[0-9a-f]{40}$ ]]
          packagesite_url=https://pkg.freebsd.org/FreeBSD:16:amd64/latest/packagesite.pkg
          curl "${retry[@]}" -o "${RUNNER_TEMP}/packagesite.pkg" "${packagesite_url}"
          ports_sha=$(tar -xOf "${RUNNER_TEMP}/packagesite.pkg" packagesite.yaml | \
            jq -Rr 'fromjson? | select(.name == "pkg") | .annotations.ports_top_git_hash // empty' | \
            sort -u)
          [[ "${ports_sha}" =~ ^[0-9a-f]{40}$ ]]

          base_sha=$(awk -F '\t' '$1=="base.txz" {print $2}' "${RUNNER_TEMP}/MANIFEST")
          [[ "${base_sha}" =~ ^[0-9a-f]{64}$ ]]

          curl "${retry[@]}" -o "${RUNNER_TEMP}/VM-CHECKSUM.SHA256" "${VM}/CHECKSUM.SHA256"
          vm_line=$(grep -E \
            "^SHA256 \\(FreeBSD-16\\.0-CURRENT-amd64-BASIC-CLOUDINIT-${builddate}-${revision}-[0-9]+-ufs\\.qcow2\\.xz\\) = [0-9a-f]{64}$" \
            "${RUNNER_TEMP}/VM-CHECKSUM.SHA256")
          [[ "$(wc -l <<<"${vm_line}" | tr -d ' ')" == 1 ]]
          vm_manifest_name=$(sed -E 's/^SHA256 \(([^)]+)\) = .*$/\1/' <<<"${vm_line}")
          vm_compressed_sha=$(awk '{print $4}' <<<"${vm_line}")
          [[ "${vm_compressed_sha}" =~ ^[0-9a-f]{64}$ ]]
          # FreeBSD's checksum names the exact build, while Latest publishes a
          # stable alias for those bytes. The checksum makes the alias safe.
          VM_NAME=FreeBSD-16.0-CURRENT-amd64-BASIC-CLOUDINIT-ufs.qcow2.xz
          [[ "${vm_manifest_name}" == FreeBSD-16.0-CURRENT-amd64-BASIC-CLOUDINIT-${builddate}-${revision}-*-ufs.qcow2.xz ]]
          image_url="${VM}/${VM_NAME}"
          modified=$(curl "${retry[@]}" --head "${image_url}" | sed -nE 's/^[Ll]ast-[Mm]odified: (.*)\r?$/\1/p')
          modified_date=$(date -u --date="${modified}" +%Y%m%d)
          [[ "${modified_date}" == "${builddate}" ]]

          current_image_sha=$(jq -r '.worker_image.sha256 // ""' config/freebsd-16.json)
          if "${RUNNER_TEMP}/fsbuild" blob check --sha256 "${base_sha}" \
            --output "${RUNNER_TEMP}/base-blob.json"; then
            echo "Reusing verified jail seed ${base_sha} from R2."
          else
            curl "${retry[@]}" -o "${RUNNER_TEMP}/base.txz" "${DIST}/base.txz"
            echo "${base_sha}  ${RUNNER_TEMP}/base.txz" | sha256sum -c -
            "${RUNNER_TEMP}/fsbuild" blob put --file "${RUNNER_TEMP}/base.txz" \
              --output "${RUNNER_TEMP}/base-blob.json"
            rm -f "${RUNNER_TEMP}/base.txz"
          fi

          if [[ "${current_image_sha}" =~ ^[0-9a-f]{64}$ ]] && \
            jq -e --arg url "${image_url}" --arg compressed "${vm_compressed_sha}" \
              --arg sha "${current_image_sha}" \
              '.schema_version=="freesense.freebsd-pin/v2" and .ready==true and
               .worker_image.url==$url and
               .worker_image.upstream_compressed_sha256==$compressed and
               .worker_image.sha256==$sha and
               .worker_image.object==("inputs/sha256/"+$sha) and
               ((.worker_image.size|type)=="number") and .worker_image.size>0' \
              config/freebsd-16.json >/dev/null && \
            "${RUNNER_TEMP}/fsbuild" blob check --sha256 "${current_image_sha}" \
              --output "${RUNNER_TEMP}/image-blob.json" && \
            jq -e --slurpfile blob "${RUNNER_TEMP}/image-blob.json" \
              '.worker_image as $image |
               ($blob|length)==1 and $blob[0].schema_version=="freesense.blob/v1" and
               $blob[0].key==$image.object and $blob[0].sha256==$image.sha256 and
               $blob[0].size==$image.size' config/freebsd-16.json >/dev/null; then
            echo "Reusing verified worker image ${current_image_sha} from R2."
          else
            rm -f "${RUNNER_TEMP}/${VM_NAME}" "${RUNNER_TEMP}/${VM_NAME%.xz}" \
              "${RUNNER_TEMP}/freebsd-16-worker.qcow2"
            curl "${retry[@]}" -o "${RUNNER_TEMP}/${VM_NAME}" "${image_url}"
            echo "${vm_compressed_sha}  ${RUNNER_TEMP}/${VM_NAME}" | sha256sum -c -
            xz -dk "${RUNNER_TEMP}/${VM_NAME}"
            raw="${RUNNER_TEMP}/${VM_NAME%.xz}"
            qemu-img convert -c -f qcow2 -O qcow2 \
              -o compat=1.1,lazy_refcounts=off,cluster_size=65536 -S 4k \
              "${raw}" "${RUNNER_TEMP}/freebsd-16-worker.qcow2"
            qemu-img check -f qcow2 "${RUNNER_TEMP}/freebsd-16-worker.qcow2"
            rm -f "${RUNNER_TEMP}/${VM_NAME}" "${raw}"
            "${RUNNER_TEMP}/fsbuild" blob put --file "${RUNNER_TEMP}/freebsd-16-worker.qcow2" \
              --output "${RUNNER_TEMP}/image-blob.json"
          fi

          jq -n \
            --arg freebsd_sha "${freebsd_sha}" --arg revision "${revision}" \
            --arg ports_sha "${ports_sha}" \
            --arg builddate "${builddate}" --arg base_url "${DIST}/base.txz" \
            --arg base_upstream_sha256 "${base_sha}" \
            --arg base_object "$(jq -r .key "${RUNNER_TEMP}/base-blob.json")" \
            --arg base_sha256 "$(jq -r .sha256 "${RUNNER_TEMP}/base-blob.json")" \
            --arg image_url "${image_url}" \
            --arg image_upstream_sha256 "${vm_compressed_sha}" \
            --arg image_object "$(jq -r .key "${RUNNER_TEMP}/image-blob.json")" \
            --arg image_sha256 "$(jq -r .sha256 "${RUNNER_TEMP}/image-blob.json")" \
            --argjson base_size "$(jq -r .size "${RUNNER_TEMP}/base-blob.json")" \
            --argjson image_size "$(jq -r .size "${RUNNER_TEMP}/image-blob.json")" \
            '{schema_version:"freesense.freebsd-pin/v2",ready:true,freebsd_source:{commit:$freebsd_sha,revision_prefix:$revision,build_date:$builddate},freebsd_ports:{commit:$ports_sha},jail_seed:{url:$base_url,upstream_sha256:$base_upstream_sha256,object:$base_object,sha256:$base_sha256,size:$base_size},worker_image:{url:$image_url,upstream_compressed_sha256:$image_upstream_sha256,object:$image_object,sha256:$image_sha256,size:$image_size}}' \
            > config/freebsd-16.json
          jq -e '.ready and (.freebsd_source.commit|length)==40' config/freebsd-16.json
          echo "image_sha256=$(jq -r .worker_image.sha256 config/freebsd-16.json)" >>"${GITHUB_OUTPUT}"

      - name: Boot the exact R2 image on the KVM build runner
        env:
          FSBUILD: ${{ runner.temp }}/fsbuild
        run: >-
          scripts/runner/run-vm.sh
          --image-sha256 "${{ steps.resolve.outputs.image_sha256 }}"
          --script scripts/runner/probe.sh
          --timeout 3600

      - name: Open or update the single pin PR
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- config/freebsd-16.json; then
            echo "The current pin is already exact; no branch or PR created."
            exit 0
          fi
          branch=automation/freebsd-pin
          pin_file="${RUNNER_TEMP}/freebsd-16.json"
          cp config/freebsd-16.json "${pin_file}"
          git config user.name freesense-ci
          git config user.email ci@freesense.org
          git fetch --no-tags origin main
          git switch -C "${branch}" origin/main
          cp "${pin_file}" config/freebsd-16.json
          git add config/freebsd-16.json
          git commit -m "build: pin official FreeBSD 16 snapshot"
          git push --force origin "HEAD:refs/heads/${branch}"
          number=$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number // empty')
          if [[ -z "${number}" ]]; then
            gh pr create --head "${branch}" --base main \
              --title "Pin the current official FreeBSD 16 snapshot" \
              --body "Automated checksum-verified FreeBSD source, jail seed, and KVM worker-image pin. The fixed branch is reused; pinning never creates tag or branch sprawl."
          else
            echo "Updated pin PR #${number}"
          fi
          gh workflow run ci.yml --ref "${branch}"
          echo "Dispatched required CI for ${branch}."

      - name: Clean pinning downloads
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/MANIFEST" "${RUNNER_TEMP}/VM-CHECKSUM.SHA256" \
            "${RUNNER_TEMP}/base.txz" "${RUNNER_TEMP}/base-blob.json" \
            "${RUNNER_TEMP}/image-blob.json" "${RUNNER_TEMP}/packagesite.pkg" \
            "${RUNNER_TEMP}/freebsd-16-worker.qcow2" \
            "${RUNNER_TEMP}"/FreeBSD-16.0-CURRENT-amd64-BASIC-CLOUDINIT-*.qcow2 \
            "${RUNNER_TEMP}"/FreeBSD-16.0-CURRENT-amd64-BASIC-CLOUDINIT-*.qcow2.xz
