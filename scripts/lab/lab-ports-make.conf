# FreeSense 2.0 lab ports options (from Development 1.2 tools/conf/pfPorts/make.conf, names adapted to the pinned ports tree)
# Installed as /build/ports-make.conf by lab-ports.sh. Kea is built from an overlay without kea-shell (lab-ports.sh).
ALLOW_UNSUPPORTED_SYSTEM=yes
IGNORE_OSVERSION=yes
DEFAULT_VERSIONS=	ssl=base
OPTIONS_UNSET+=	DOCS EXAMPLES NLS
net_nss_ldap_UNSET_FORCE=	KERBEROS
security_openvpn_SET_FORCE=	X509ALTUSERNAME ASYNC_PUSH
security_openvpn_UNSET_FORCE=	EASYRSA
shells_scponly_SET_FORCE=	CHROOT SCP WILDCARDS WINSCP
shells_scponly_UNSET_FORCE=	DEFAULT_CHDIR DOCS GFTP RSYNC SUBVERSION SVNSERVE UNISON
security_strongswan_SET_FORCE=	CURL EAPDYNAMIC EAPRADIUS EAPSIMFILE GCM IKEV1 UNBOUND XAUTH IPSECKEY PKCS11 PKI UNITY VICI VSTR SWANCTL
security_strongswan_UNSET_FORCE=	EAPAKA3GPP2 BUILTIN LIBC SMP
